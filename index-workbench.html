<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<meta name="theme-color" content="#e8f3f3" />
<title>立体密铺实验室 · POLYLAB</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#dce8e9}
#polylab-room{position:fixed;inset:0;overflow:hidden;background:#dce8e9}
#polylab-room .room-backdrop{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center center;user-select:none;-webkit-user-drag:none}

.toto-wrap{
  position:absolute;z-index:4;
  left:69.8%;top:32.5%;width:14.1%;height:29.4%;
  border-radius:50%;pointer-events:none;
}
#totoCanvas{
  position:absolute;left:-30%;top:-35%;width:160%;height:175%;
  pointer-events:none;display:block;
}


.bench-wrap{position:absolute;z-index:3;left:57%;bottom:9%;width:min(40vw,62vh);aspect-ratio:1/.72;transform:translateX(-50%);pointer-events:none;animation:benchIn 1.2s ease-out both}
#benchCanvas{width:100%;height:100%;display:block}
@keyframes benchIn{from{opacity:0;transform:translateX(-50%) translateY(24px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}

/* 拓拓 AI 对话层：独立叠加，不改动实验室与 3D 画布 */
.toto-wrap{pointer-events:auto;cursor:pointer}
#totoCanvas{pointer-events:auto}
#toto-ai-panel{position:fixed;z-index:30;right:24px;bottom:24px;width:min(410px,calc(100vw - 32px));height:min(620px,calc(100vh - 48px));display:none;flex-direction:column;overflow:hidden;border:1px solid rgba(118,226,238,.55);border-radius:22px;background:linear-gradient(155deg,rgba(8,24,43,.97),rgba(12,35,57,.96));box-shadow:0 0 0 1px rgba(255,255,255,.08) inset,0 18px 70px rgba(0,12,28,.48),0 0 34px rgba(65,207,224,.20);backdrop-filter:blur(18px);color:#eafaff;font-family:inherit}
#toto-ai-panel.open{display:flex;animation:totoPanelIn .22s ease-out}
@keyframes totoPanelIn{from{opacity:0;transform:translateY(12px) scale(.985)}to{opacity:1;transform:translateY(0) scale(1)}}
.toto-ai-head{display:flex;align-items:center;gap:11px;padding:15px 16px;border-bottom:1px solid rgba(133,225,238,.2);background:linear-gradient(90deg,rgba(37,112,144,.25),rgba(40,65,110,.12))}
.toto-ai-orb{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:#092538;font-weight:900;background:radial-gradient(circle at 35% 25%,#fff 0,#aaf7ff 22%,#43c7d7 62%,#12628a 100%);box-shadow:0 0 18px rgba(84,225,240,.55)}
.toto-ai-title{font-weight:800;letter-spacing:.06em;font-size:15px}.toto-ai-sub{font-size:11px;color:#9fc8d5;margin-top:3px}
.toto-ai-head button{margin-left:auto;border:1px solid rgba(157,225,236,.25);background:rgba(255,255,255,.07);color:#dffaff;border-radius:9px;padding:6px 10px;cursor:pointer}
#toto-ai-messages{flex:1;overflow:auto;padding:16px 13px;display:flex;flex-direction:column;gap:12px;scroll-behavior:smooth}
.toto-msg{max-width:88%;padding:11px 13px;border-radius:14px;font-size:13px;line-height:1.65;white-space:pre-wrap;overflow-wrap:anywhere}
.toto-msg.bot{align-self:flex-start;background:rgba(87,166,188,.16);border:1px solid rgba(114,219,232,.18);color:#e7faff;border-top-left-radius:4px}
.toto-msg.user{align-self:flex-end;background:linear-gradient(135deg,#1d91a9,#3567b6);color:white;border-top-right-radius:4px}
.toto-ai-status{min-height:18px;padding:0 15px 7px;color:#80c9d7;font-size:11px}
.toto-ai-compose{padding:11px 12px 13px;border-top:1px solid rgba(133,225,238,.2);background:rgba(3,17,31,.45)}
.toto-ai-context{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin:0 0 9px;padding:9px;border:1px solid rgba(115,213,229,.16);border-radius:11px;background:rgba(37,105,132,.10)}
.toto-ai-context-title{grid-column:1/-1;color:#9bd9e5;font-size:10px;letter-spacing:.06em}
.toto-ai-context label{display:flex;flex-direction:column;gap:4px;color:#83b9c6;font-size:10px;min-width:0}
.toto-ai-context select{width:100%;min-width:0;background:#071a2b;border:1px solid rgba(132,218,231,.25);border-radius:7px;color:#e8fbff;padding:7px 6px;font-size:11px;outline:none}
.toto-ai-endpoint{display:none;margin-bottom:9px}.toto-ai-endpoint.show{display:block}
.toto-ai-endpoint input{width:100%;box-sizing:border-box;background:#071a2b;border:1px solid rgba(132,218,231,.3);border-radius:8px;color:#e8fbff;padding:8px;font-size:11px;outline:none}
.toto-ai-tools{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;font-size:10px;color:#83b9c6}
.toto-ai-tools button{background:none;border:0;color:#91d9e5;text-decoration:underline;cursor:pointer;font-size:10px}
.toto-ai-row{display:flex;gap:8px;align-items:flex-end}
#toto-ai-input{flex:1;resize:none;min-height:42px;max-height:110px;box-sizing:border-box;background:rgba(2,15,28,.82);border:1px solid rgba(119,216,230,.28);border-radius:12px;color:#effcff;padding:11px 12px;font:13px/1.5 inherit;outline:none}
#toto-ai-input:focus{border-color:#5ed9e8;box-shadow:0 0 0 2px rgba(75,205,222,.12)}
#toto-ai-send{height:42px;min-width:62px;border:0;border-radius:11px;background:linear-gradient(135deg,#55d8df,#3984c9);color:#06283b;font-weight:800;cursor:pointer}
#toto-ai-send:disabled{opacity:.45;cursor:wait}
@media(max-width:600px){#toto-ai-panel{right:10px;bottom:10px;width:calc(100vw - 20px);height:min(72vh,620px)}}


/* 拓拓状态光环：只叠加在原 3D 机器人容器外，不修改 Canvas 几何绘制 */
#polylab-room .toto-wrap[data-ai-state="thinking"]::after,
#polylab-room .toto-wrap[data-ai-state="speaking"]::after{content:"";position:absolute;inset:-12%;border-radius:50%;pointer-events:none;z-index:-1}
#polylab-room .toto-wrap[data-ai-state="thinking"]::after{border:1px solid rgba(72,224,244,.72);box-shadow:0 0 18px rgba(58,211,238,.32),inset 0 0 18px rgba(58,211,238,.12);animation:totoThinkPulse 1.45s ease-in-out infinite}
#polylab-room .toto-wrap[data-ai-state="speaking"]::after{border:2px solid rgba(255,206,112,.72);box-shadow:0 0 24px rgba(255,190,88,.4);animation:totoSpeakPulse .7s ease-in-out infinite alternate}
@keyframes totoThinkPulse{0%,100%{transform:scale(.94);opacity:.48}50%{transform:scale(1.08);opacity:1}}
@keyframes totoSpeakPulse{from{transform:scale(.96);opacity:.55}to{transform:scale(1.1);opacity:1}}
#toto-ai-stop{display:none;background:rgba(218,106,113,.14)!important;border:1px solid rgba(255,151,158,.38)!important;color:#ffc5c8!important;border-radius:8px;padding:4px 8px;cursor:pointer;font-size:10px}
#toto-ai-panel[data-busy="true"] #toto-ai-stop{display:inline-block}

</style>
</head>

const SHELL='#f8fbff',TEAL='#4fc3d0',GOLD='#e6b34e',ROSE='#e58a9f',SLATE='#8fa3a8';
const hex=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16));

      ringPath(160);ctx.strokeStyle='rgba(210,250,255,.5)';ctx.lineWidth=1.6;ctx.stroke();
      ctx.save();ctx.rotate(-t*.5);ctx.setLineDash([10,10]);ringPath(112);ctx.strokeStyle='rgba(230,252,255,.7)';ctx.lineWidth=2;ctx.stroke();ctx.restore();
      ringPath(62);ctx.strokeStyle='rgba(255,255,255,.9)';ctx.lineWidth=2.4;ctx.stroke();
      const ph=(t*.32)%1;ringPath(20+ph*216);ctx.strokeStyle='rgba(235,253,255,'+(.8*(1-ph))+')';ctx.lineWidth=2.5;ctx.stroke();
      ctx.save();ctx.globalCompositeOperation='lighter';
      g=ctx.createRadialGradient(0,0,0,0,0,120);g.addColorStop(0,'rgba(220,255,255,.95)');g.addColorStop(1,'rgba(79,208,224,0)');
      ctx.fillStyle=g;ringPath(120);ctx.fill();ctx.restore();
    });
    ctx.restore();
  }});

  /* 5. 全息：光锥 + 上升扫描环 + 漏斗光环 */
  const b0=VP(0,FY,0),b1=VP(0,318,0),w0=100*s*b0.f,w1=16*s*b1.f;
  items.push({z:-3,fn:()=>{
    ctx.save();ctx.globalCompositeOperation='lighter';
    let g=ctx.createLinearGradient(0,b0.y,0,b1.y);g.addColorStop(0,'rgba(130,232,255,.62)');g.addColorStop(.55,'rgba(110,210,255,.18)');g.addColorStop(1,'rgba(150,235,255,0)');
    ctx.fillStyle=g;ctx.beginPath();ctx.moveTo(b0.x-w0,b0.y);ctx.lineTo(b0.x+w0,b0.y);ctx.lineTo(b1.x+w1,b1.y);ctx.lineTo(b1.x-w1,b1.y);ctx.closePath();ctx.fill();
    g=ctx.createLinearGradient(0,b0.y,0,b1.y);g.addColorStop(0,'rgba(240,255,255,.7)');g.addColorStop(1,'rgba(240,255,255,0)');
    ctx.fillStyle=g;ctx.fillRect(b0.x-2.2*s,b1.y,4.4*s,b0.y-b1.y);
    ctx.translate(b0.x,b0.y);ctx.scale(1,sp);
    g=ctx.createRadialGradient(0,0,0,0,0,130*s*b0.f);g.addColorStop(0,'rgba(220,255,255,.7)');g.addColorStop(1,'rgba(79,208,224,0)');
    ctx.fillStyle=g;ctx.beginPath();ctx.arc(0,0,130*s*b0.f,0,TAU);ctx.fill();
    ctx.restore();
  }});
  const HAL=[[104,226],[146,184],[190,146],[236,108]];
  HAL.forEach((h,hi)=>{
    const ph=t*(.45+hi*.12)*(hi%2?1:-1)*amp,pts=[];
    for(let i=0;i<=48;i++){const a=i/48*TAU+ph;pts.push(VP(h[1]*Math.sin(a),h[0],h[1]*Math.cos(a)));}
    arcPair(pts,VP(0,h[0],0).v[2],CI,1.6,.75-hi*.08,5,Math.floor(t*5),true);
  });
  for(let k=0;k<3;k++){
    const f=(t*.28+k/3)%1,y=FY+6+f*190,r=70+f*20,pts=[];
    for(let i=0;i<=40;i++){const a=i/40*TAU;pts.push(VP(r*Math.sin(a),y,r*Math.cos(a)));}
    arcPair(pts,VP(0,y,0).v[2],CT,1.4,.7*Math.sin(Math.PI*f),0,0,true);
  }

  /* 6. 悬浮宝石（旋转 + 半透明切面 + 光照） */
  {
    const gz=226+Math.sin(t*1.6)*8*amp,spin=t*.75,tl=.14*Math.sin(t*.9),K=56;
    const loc=[];
    for(let i=0;i<6;i++){const a=i*Math.PI/3;loc.push([.46*Math.cos(a),1.0,.46*Math.sin(a)]);}
    for(let i=0;i<6;i++){const a=i*Math.PI/3+Math.PI/6;loc.push([Math.cos(a),.3,Math.sin(a)]);}
    loc.push([0,-1.15,0]);
    const wv=loc.map(p=>{const y2=p[1]*Math.cos(tl)-p[2]*Math.sin(tl),z2=p[1]*Math.sin(tl)+p[2]*Math.cos(tl);
      const x3=p[0]*Math.cos(spin)+z2*Math.sin(spin),z3=-p[0]*Math.sin(spin)+z2*Math.cos(spin);return[x3*K,gz+y2*K,z3*K];});
    const pv=wv.map(p=>VP(p[0],p[1],p[2]));
    const gc=VP(0,gz,0);
    items.push({z:gc.v[2]-8,fn:()=>{ctx.save();ctx.globalCompositeOperation='lighter';const R=130*s*gc.f,g=ctx.createRadialGradient(gc.x,gc.y,0,gc.x,gc.y,R);g.addColorStop(0,'rgba(150,235,255,.6)');g.addColorStop(.5,'rgba(79,170,230,.2)');g.addColorStop(1,'rgba(79,208,224,0)');ctx.fillStyle=g;ctx.beginPath();ctx.arc(gc.x,gc.y,R,0,TAU);ctx.fill();ctx.restore();}});
    FACES.forEach(ids=>{
      let nx=0,ny=0,nz=0,mx=0,my=0,mz=0;
      for(let k=0;k<ids.length;k++){const a=wv[ids[k]],b=wv[ids[(k+1)%ids.length]];nx+=(a[1]-b[1])*(a[2]+b[2]);ny+=(a[2]-b[2])*(a[0]+b[0]);nz+=(a[0]-b[0])*(a[1]+b[1]);mx+=a[0];my+=a[1];mz+=a[2];}
      const l=Math.hypot(nx,ny,nz)||1;nx/=l;ny/=l;nz/=l;mx/=ids.length;my/=ids.length;mz/=ids.length;
      if(nx*mx+ny*(my-gz)+nz*mz<0){nx=-nx;ny=-ny;nz=-nz;}
      const nr=rot(nx,ny,nz),q=ids.map(i=>pv[i]);
      const cc=[0,0,0];q.forEach(p=>{cc[0]+=p.v[0]/q.length;cc[1]+=p.v[1]/q.length;cc[2]+=p.v[2]/q.length;});
      const front=facing(cc,nr),lt=.5+.5*dot(nr,Lc);
      let col=mixA(CBLUE,CW,clamp(lt*.95,0,1));col=mixA(col,CT,.18);
      const fa=front?.62:.22,ea=front?.95:.35;
      items.push({z:cc[2]+(front?0:-4),fn:()=>{ctx.save();ctx.lineJoin='round';ctx.beginPath();q.forEach((p,i)=>i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y));ctx.closePath();ctx.fillStyle=css(col,fa);ctx.fill();ctx.strokeStyle='rgba(235,253,255,'+ea+')';ctx.lineWidth=1.5*s;ctx.stroke();ctx.restore();}});
    });
    /* 环绕宝石的轨道环与卫星 */
    [[.9,.6,1],[-.55,-.4,-1]].forEach((o,oi)=>{
      const c=[0,gz,0],rr=84+oi*14;
      arcPair(orbitPts(c,rr,56,o[0],o[1]+t*.5*o[2],0),gc.v[2],oi?CI:CT,1.4,.85,0,0,true);
      const sat=orbitPts(c,rr,1,o[0],o[1]+t*.5*o[2],t*1.3*o[2]+oi*2)[0];
      items.push({z:sat.v[2],fn:()=>{ctx.save();ctx.globalCompositeOperation='lighter';const R=11*s*sat.f,g=ctx.createRadialGradient(sat.x,sat.y,0,sat.x,sat.y,R);g.addColorStop(0,'rgba(255,255,255,1)');g.addColorStop(.4,'rgba(130,235,255,.8)');g.addColorStop(1,'rgba(79,208,224,0)');ctx.fillStyle=g;ctx.beginPath();ctx.arc(sat.x,sat.y,R,0,TAU);ctx.fill();ctx.restore();}});
    });
  }

  /* 7. 上升粒子 */
  PA.forEach(p=>{
    const f=(p.p+t*p.sp*amp)%1,a=p.a+t*p.sw,rr=p.r*(1-.45*f),pt=VP(rr*Math.sin(a),FY+4+f*214,rr*Math.cos(a)),al=Math.sin(Math.PI*f);
    items.push({z:pt.v[2],fn:()=>{ctx.save();ctx.globalCompositeOperation='lighter';const R=p.sz*2.6*s*pt.f,g=ctx.createRadialGradient(pt.x,pt.y,0,pt.x,pt.y,R);g.addColorStop(0,'rgba(240,255,255,'+al+')');g.addColorStop(1,'rgba(79,208,224,0)');ctx.fillStyle=g;ctx.beginPath();ctx.arc(pt.x,pt.y,R,0,TAU);ctx.fill();ctx.restore();}});
  });

  /* 8. 正面弧形蓝色显示屏「探索 · 创造 · 发现」+ 两侧倾斜护翼 */
  {
    const TH=.60,N=64,y0=54,y1=102,R=283.5,top=[],bot=[];
    for(let i=0;i<=N;i++){const a=-TH+2*TH*i/N;top.push(VP(R*Math.sin(a),y1,R*Math.cos(a)));bot.push(VP(R*Math.sin(a),y0,R*Math.cos(a)));}
    items.push({z:1200,fn:()=>{
      const sw2=tex.width/N,th=tex.height;
      for(let i=0;i<N;i++){
        const TL=top[i],TR=top[i+1],BL=bot[i];
        ctx.save();
        ctx.transform((TR.x-TL.x)/sw2,(TR.y-TL.y)/sw2,(BL.x-TL.x)/th,(BL.y-TL.y)/th,TL.x,TL.y);
        ctx.drawImage(tex,i*sw2,0,sw2+1.2,th,0,0,sw2+1.2,th);
        ctx.restore();
      }
      const u0=(t*.32)%1.5-.25;
      for(let i=0;i<N;i++){
        const ui=(i+.5)/N,k=Math.exp(-((ui-u0)*(ui-u0))/.004),ea=Math.abs(ui-.5)*2,dark=.28*ea*ea;
        if(k<.02&&dark<.01)continue;
        ctx.beginPath();ctx.moveTo(top[i].x,top[i].y);ctx.lineTo(top[i+1].x,top[i+1].y);ctx.lineTo(bot[i+1].x,bot[i+1].y);ctx.lineTo(bot[i].x,bot[i].y);ctx.closePath();
        if(dark>=.01){ctx.fillStyle='rgba(10,30,70,'+dark+')';ctx.fill();}
        if(k>=.02){ctx.fillStyle='rgba(255,255,255,'+(k*.42)+')';ctx.fill();}
      }
      ctx.lineJoin='round';
      [top,bot].forEach(arr=>{ctx.beginPath();arr.forEach((p,i)=>i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y));ctx.strokeStyle='rgba(140,235,255,.35)';ctx.lineWidth=7*s;ctx.stroke();ctx.strokeStyle='rgba(235,252,255,.95)';ctx.lineWidth=2.2*s;ctx.stroke();});
    }});
    [-1,1].forEach(sd=>{
      const poly=[[.66,102],[.82,102],[.92,54],[.66,54]].map(q=>VP(R*Math.sin(q[0]*sd),q[1],R*Math.cos(q[0]*sd)));
      const inner=[[.72,92],[.80,92],[.86,64],[.72,64]].map(q=>VP(R*Math.sin(q[0]*sd),q[1],R*Math.cos(q[0]*sd)));
      items.push({z:1250,fn:()=>{
        ctx.save();ctx.lineJoin='round';
        ctx.beginPath();poly.forEach((p,i)=>i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y));ctx.closePath();
        ctx.fillStyle='rgba(255,255,255,.55)';ctx.fill();ctx.strokeStyle='rgba(120,225,255,.6)';ctx.lineWidth=6*s;ctx.stroke();ctx.strokeStyle='rgba(255,255,255,.95)';ctx.lineWidth=2*s;ctx.stroke();
        ctx.beginPath();inner.forEach((p,i)=>i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y));ctx.closePath();
        ctx.fillStyle='rgba(60,170,230,'+(.35+.2*Math.sin(t*3))+')';ctx.fill();ctx.strokeStyle='rgba(79,208,224,.9)';ctx.lineWidth=1.6*s;ctx.stroke();
        ctx.restore();
      }});
    });
  }

  items.sort((a,b)=>a.z-b.z);
  for(let i=0;i<items.length;i++)items[i].fn();
}
requestAnimationFrame(frame);
})();

</script>

<script>
/* 拓拓 AI 前端桥接：保留原 3D 动画，只增加独立聊天交互 */
(()=>{
 const robot=document.getElementById('openTotoChat'),panel=document.getElementById('toto-ai-panel');
 if(!robot||!panel)return;
 const $=id=>document.getElementById(id),input=$('toto-ai-input'),messages=$('toto-ai-messages'),status=$('toto-ai-status'),send=$('toto-ai-send'),api=$('toto-ai-api'),settings=$('toto-ai-endpoint');
 let history=[],busy=false,controller=null;
 api.value=localStorage.getItem('toto_ai_endpoint')||'';
 const setStatus=t=>status.textContent=t;
 const open=()=>{panel.classList.add('open');input.focus();};
 const close=()=>panel.classList.remove('open');
 robot.addEventListener('click',open);
 robot.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();open();}});
 $('toto-ai-close').addEventListener('click',close);
 $('toto-ai-stop').addEventListener('click',()=>{if(controller)controller.abort();});
 $('toto-ai-settings').addEventListener('click',()=>settings.classList.toggle('show'));
 api.addEventListener('change',()=>{localStorage.setItem('toto_ai_endpoint',api.value.trim());setStatus(api.value.trim()?'服务地址已保存，请发送消息测试':'尚未配置服务地址');});
 function add(text,who){const el=document.createElement('div');el.className='toto-msg '+who;el.textContent=text;messages.appendChild(el);messages.scrollTop=messages.scrollHeight;return el;}
 $('toto-ai-clear').addEventListener('click',()=>{history=[];messages.innerHTML='';add('对话已清空。你好，我是拓拓，我们重新开始探索吧！','bot');setStatus('对话已清空');});
 async function ask(){
   const q=input.value.trim();if(!q||busy)return;
   const endpoint=api.value.trim()||window.TOTO_AI_API||'';
   if(!endpoint){settings.classList.add('show');setStatus('请先在“连接设置”中填写已部署的拓拓 AI 服务地址');return;}
   add(q,'user');input.value='';history.push({role:'user',content:q});busy=true;send.disabled=true;send.textContent='…';setStatus('拓拓正在思考…');robot.dataset.aiState='thinking';panel.dataset.busy='true';
   const sceneContext={shape:$('toto-ai-shape').value,action:$('toto-ai-action').value,issue:$('toto-ai-issue').value};
   const contextText=Object.entries(sceneContext).filter(([,v])=>v&&v!=='未指定').map(([k,v])=>({shape:'图形',action:'操作',issue:'遇到的情况'}[k]+'：'+v)).join('；');
   const pending=add('拓拓正在整理思路…','bot');controller=new AbortController();
   try{
     const response=await fetch(endpoint,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages:history.slice(-16),sceneContext}),signal:controller.signal});
     const data=await response.json().catch(()=>({}));
     if(!response.ok)throw new Error(data.error||('服务请求失败（HTTP '+response.status+'）'));
     const answer=data.reply||data.choices?.[0]?.message?.content||'我暂时没有得到有效回答，请稍后再试。';
     pending.textContent=answer;history.push({role:'assistant',content:answer});setStatus((data.knowledgeUsed?'已结合密铺知识库':'已完成回答')+(contextText?' · 已参考探究情境':'') );robot.dataset.aiState='speaking';setTimeout(()=>{if(robot.dataset.aiState==='speaking')robot.dataset.aiState='idle';},1100);
   }catch(err){pending.textContent=err.name==='AbortError'?'本次回答已停止。':'连接失败：'+err.message;setStatus(err.name==='AbortError'?'已停止生成':'请检查服务地址和后端配置');robot.dataset.aiState='idle';}
   finally{busy=false;delete panel.dataset.busy;send.disabled=false;send.textContent='发送';controller=null;input.focus();}
 }
 send.addEventListener('click',ask);
 input.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();ask();}});
})();
</script>
