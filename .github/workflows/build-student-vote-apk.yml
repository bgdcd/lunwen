name: Build Student Vote APK
on:
  push:
    paths:
      - 'student-vote-android-shell/**'
      - '.github/workflows/build-student-vote-apk.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        working-directory: student-vote-android-shell
        run: gradle --no-daemon assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: student-vote-apk
          path: student-vote-android-shell/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
