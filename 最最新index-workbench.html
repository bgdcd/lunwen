<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<meta name="theme-color" content="#e8f3f3" />
<title>立体密铺实验室 · POLYLAB</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#dce8e9}
#polylab-room{position:fixed;inset:0;overflow:hidden;background:#dce8e9}
#polylab-room .room-backdrop{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center center;user-select:none;-webkit-user-drag:none}

.toto-wrap{
  position:absolute;z-index:4;
  left:69.8%;top:32.5%;width:14.1%;height:29.4%;
  border-radius:50%;pointer-events:none;
}
#totoCanvas{
  position:absolute;left:-30%;top:-35%;width:160%;height:175%;
  pointer-events:none;display:block;
}


.bench-wrap{position:absolute;z-index:3;left:49%;bottom:15%;width:min(43vw,78vh);aspect-ratio:1/.72;transform:translateX(-50%);pointer-events:none;animation:benchIn 1s ease-out both}
#benchCanvas{width:100%;height:100%;display:block}
@keyframes benchIn{from{opacity:0}to{opacity:1}}
#openTotoChat{pointer-events:auto!important;cursor:pointer}
.toto-hint{position:absolute;z-index:5;left:61.5%;top:17%;width:13.5%;min-width:150px;padding:10px 14px;border:2px solid #7fb6ff;border-radius:16px;background:rgba(255,255,255,.94);color:#2a5aa8;font:600 clamp(11px,.95vw,15px)/1.45 "PingFang SC","Microsoft YaHei",sans-serif;box-shadow:0 6px 20px rgba(60,120,220,.25);cursor:pointer;animation:hintIn .6s ease-out .8s both}
.toto-hint:after{content:"";position:absolute;right:22px;bottom:-9px;width:14px;height:14px;background:inherit;border-right:2px solid #7fb6ff;border-bottom:2px solid #7fb6ff;transform:rotate(45deg)}
.toto-hint.hide{display:none}
@keyframes hintIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.toto-chat{position:fixed;z-index:20;right:2%;bottom:3%;width:min(380px,92vw);height:min(560px,76vh);display:none;flex-direction:column;border-radius:20px;overflow:hidden;background:rgba(246,250,255,.96);border:1.5px solid rgba(110,170,255,.6);box-shadow:0 18px 50px rgba(30,70,140,.35),0 0 0 4px rgba(120,200,255,.18);backdrop-filter:blur(10px);font-family:"PingFang SC","Microsoft YaHei",sans-serif}
.toto-chat.open{display:flex;animation:chatIn .25s ease-out}
@keyframes chatIn{from{opacity:0;transform:translateY(14px) scale(.97)}to{opacity:1;transform:none}}
.tc-head{display:flex;align-items:center;gap:10px;padding:12px 14px;color:#fff;background:linear-gradient(135deg,#2f6fe0,#38b6e8)}
.tc-dot{width:10px;height:10px;border-radius:50%;background:#7dffb3;box-shadow:0 0 8px #7dffb3}
.tc-title{flex:1;font-weight:700;font-size:16px}.tc-title small{display:block;font-weight:400;font-size:11px;opacity:.85}
.tc-head button{border:0;background:rgba(255,255,255,.2);color:#fff;width:28px;height:28px;border-radius:50%;font-size:16px;cursor:pointer}
.tc-head button:hover{background:rgba(255,255,255,.35)}
.tc-list{flex:1;overflow:auto;padding:14px;display:flex;flex-direction:column;gap:10px}
.tc-msg{max-width:84%;padding:9px 13px;border-radius:14px;font-size:14px;line-height:1.55;white-space:pre-wrap;word-break:break-word}
.tc-msg.bot{align-self:flex-start;background:#fff;color:#27406b;border:1px solid #d6e6ff;border-top-left-radius:4px}
.tc-msg.me{align-self:flex-end;background:linear-gradient(135deg,#3b7cf0,#2f9fe6);color:#fff;border-top-right-radius:4px}
.tc-msg.err{color:#b3402e;border-color:#f1c3bb;background:#fff5f3}
.tc-msg.typing:after{content:"▍";animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
.tc-quick{display:flex;flex-wrap:wrap;gap:6px;padding:0 14px 8px}
.tc-quick button{border:1px solid #bcd7ff;background:#fff;color:#2f6fe0;border-radius:999px;padding:5px 11px;font-size:12px;cursor:pointer}
.tc-quick button:hover{background:#eaf3ff}
.tc-form{display:flex;gap:8px;padding:10px 12px;border-top:1px solid #dbe8fb;background:#fff}
.tc-form input{flex:1;border:1.5px solid #cfe0fb;border-radius:12px;padding:9px 12px;font-size:14px;outline:0;font-family:inherit}
.tc-form input:focus{border-color:#4a8cf0}
.tc-form button{border:0;border-radius:12px;padding:0 16px;background:linear-gradient(135deg,#2f6fe0,#38b6e8);color:#fff;font-weight:700;cursor:pointer}
.tc-form button:disabled{opacity:.5;cursor:default}

.tc-head button+button{margin-left:-4px}
.tc-key{display:flex;gap:6px;padding:8px 12px;background:#eef5ff;border-bottom:1px solid #dbe8fb}
.tc-key[hidden]{display:none}
.tc-key input{flex:1;min-width:0;border:1.5px solid #cfe0fb;border-radius:10px;padding:7px 10px;font-size:13px;outline:0}
.tc-key button{border:0;border-radius:10px;padding:0 12px;background:#2f6fe0;color:#fff;font-size:13px;cursor:pointer}
.tc-key button[type=button]{background:#9db6dc}

.tc-btns{display:flex;flex-direction:column;gap:7px;align-self:stretch;margin:-2px 0 2px}
.tc-btns button{border:1.5px solid #8fc0ff;background:linear-gradient(135deg,#f3f9ff,#e2f0ff);color:#1f56b8;font-weight:700;font-size:13.5px;line-height:1.35;font-family:inherit;padding:9px 12px;border-radius:12px;cursor:pointer;text-align:left;transition:transform .15s,box-shadow .15s}
.tc-btns button:hover:not(:disabled){transform:translateX(3px);box-shadow:0 3px 10px rgba(60,130,230,.3)}
.tc-btns button:disabled{opacity:.55;cursor:default}.tc-btns button.picked{opacity:1;background:linear-gradient(135deg,#2f6fe0,#38b6e8);color:#fff;border-color:transparent}

/* ===== 拓拓 · 全息终端风格 ===== */
.toto-chat{width:min(370px,92vw);height:min(540px,74vh);border-radius:10px;border:1px solid rgba(180,228,255,.7);color:#c1e8fe;
 background:radial-gradient(120% 70% at 50% 0%,rgba(51,165,229,.35),transparent 60%),linear-gradient(170deg,rgba(7,80,121,.88),rgba(2,54,84,.94));
 backdrop-filter:blur(10px) saturate(1.4);-webkit-backdrop-filter:blur(10px) saturate(1.4);
 box-shadow:0 0 0 1px rgba(111,203,255,.25),0 0 28px rgba(111,203,255,.45),0 18px 50px rgba(0,51,81,.6),inset 0 0 50px rgba(111,203,255,.14)}
.toto-chat.open{animation:tcBoot .55s cubic-bezier(.2,.9,.2,1) both}
@keyframes tcBoot{0%{opacity:0;transform:translateY(16px) scale(.96,.2);filter:brightness(3)}60%{opacity:1;transform:scale(1,1.02);filter:brightness(1.6)}100%{opacity:1;transform:none;filter:none}}
.toto-chat:before{content:"";position:absolute;inset:0;border-radius:10px;padding:1.5px;pointer-events:none;z-index:6;background:conic-gradient(from var(--a,0deg),transparent 0 70%,rgba(193,232,254,.95) 86%,transparent 100%);-webkit-mask:linear-gradient(#000000 0 0) content-box exclude,linear-gradient(#000000 0 0);mask:linear-gradient(#000000 0 0) content-box exclude,linear-gradient(#000000 0 0);animation:pkRun 5s linear infinite}
.toto-chat:after{content:"";position:absolute;inset:0;pointer-events:none;z-index:5;border-radius:10px;
 background:repeating-linear-gradient(0deg,rgba(180,228,255,.05) 0 1px,transparent 1px 3px),linear-gradient(180deg,transparent 0,rgba(180,228,255,.12) 50%,transparent 100%) 0 -120px/100% 120px no-repeat;animation:tcSweep 4.6s linear infinite}
@keyframes tcSweep{to{background-position:0 0,0 calc(100% + 120px)}}
.tc-head{position:relative;padding:12px 14px 12px 12px;background:linear-gradient(90deg,rgba(99,199,255,.38),rgba(19,141,210,.08));border-bottom:1px solid rgba(180,228,255,.45)}
.tc-head:after{content:"";position:absolute;left:12px;right:12px;bottom:-4px;height:4px;background:repeating-linear-gradient(90deg,rgba(193,232,254,.7) 0 1px,transparent 1px 8px);opacity:.5}
.tc-dot{position:relative;width:34px;height:34px;border-radius:50%;flex:none;background:radial-gradient(circle at 38% 34%,#c1e8fe,#a2ddff 40%,#53b8f0 75%);box-shadow:0 0 14px rgba(161,221,255,.95),inset 0 0 8px rgba(255,255,255,.7)}
.tc-dot:before{content:"";position:absolute;inset:-5px;border-radius:50%;border:1.5px dashed rgba(193,232,254,.9);animation:holoSpin 6s linear infinite}
.tc-dot:after{content:"";position:absolute;inset:-9px;border-radius:50%;border:1.5px solid rgba(180,228,255,.55);border-top-color:transparent;border-bottom-color:transparent;animation:holoSpin 2.4s linear infinite reverse}
@keyframes holoSpin{to{transform:rotate(360deg)}}
.tc-title{font-size:17px;letter-spacing:3px;text-shadow:0 0 12px rgba(171,224,255,.95),0 0 2px #ffffff;margin-left:8px}
.tc-title small{font:600 9.5px/1.2 "Consolas","Courier New",monospace;letter-spacing:1.8px;color:#c1e8ff;opacity:.9;margin-top:3px;text-shadow:none}
.tc-head button{background:rgba(19,141,210,.4);border:1px solid rgba(193,232,254,.6);color:#c1e8fe;border-radius:6px;width:28px;height:28px}
.tc-head button:hover{background:rgba(111,203,255,.55);box-shadow:0 0 10px rgba(150,217,254,.7)}
.tc-list{padding:16px 14px 10px;gap:12px;scrollbar-width:thin;scrollbar-color:rgba(161,221,255,.5) transparent}
.tc-list::-webkit-scrollbar{width:5px}.tc-list::-webkit-scrollbar-thumb{background:rgba(161,221,255,.5);border-radius:3px}
.tc-msg{position:relative;font-size:13.5px;line-height:1.6;border-radius:4px;max-width:88%;padding:9px 13px}
.tc-msg.bot{background:linear-gradient(160deg,rgba(81,181,238,.22),rgba(8,112,171,.34));color:#c1e8fe;border:1px solid rgba(180,228,255,.5);border-left:3px solid #a2ddff;box-shadow:0 0 14px rgba(119,206,255,.18),inset 0 0 18px rgba(130,209,255,.08);border-top-left-radius:2px}
.tc-msg.bot:before{content:"TOTO ▸";display:block;font:700 9px/1 "Consolas","Courier New",monospace;letter-spacing:2px;color:#ace1ff;margin-bottom:5px;opacity:.9}
.tc-msg.me{background:linear-gradient(135deg,rgba(255,196,70,.9),rgba(255,150,60,.88));color:#2a1700;font-weight:600;border:1px solid rgba(255,230,160,.9);border-right:3px solid #fff2b8;box-shadow:0 0 16px rgba(255,190,80,.4);border-top-right-radius:2px}
.tc-msg.err{color:#ffc9bf;border-color:rgba(255,140,120,.7);border-left-color:#ff8c78;background:rgba(120,30,20,.35)}
.tc-msg.typing:after{color:#c1e8ff;text-shadow:0 0 6px #a2ddff}
.tc-quick{padding:0 14px 8px}
.tc-quick button{background:rgba(59,169,231,.3);border:1px solid rgba(190,231,255,.7);color:#c1e8fe;border-radius:4px}
.tc-quick button:hover{background:rgba(111,203,255,.55);box-shadow:0 0 12px rgba(150,217,254,.6)}
.tc-form{position:relative;z-index:7;padding:10px 12px;border-top:1px solid rgba(180,228,255,.45);background:linear-gradient(0deg,rgba(20,148,220,.25),rgba(7,75,113,.2))}
.tc-form input{background:rgba(2,61,94,.75);border:1px solid rgba(180,228,255,.55);color:#c1e8fe;border-radius:4px;box-shadow:inset 0 0 12px rgba(111,203,255,.18)}
.tc-form input::placeholder{color:rgba(198,231,250,.55)}
.tc-form input:focus{border-color:#c1e8ff;box-shadow:0 0 12px rgba(150,217,254,.55),inset 0 0 12px rgba(111,203,255,.2)}
.tc-form button{border-radius:4px;background:linear-gradient(135deg,#54bcf7,#8cd5fe);color:#004a74;letter-spacing:2px;box-shadow:0 0 14px rgba(141,213,254,.6)}
.tc-form button:hover:not(:disabled){filter:brightness(1.15)}
.tc-key{background:rgba(11,99,148,.6);border-bottom:1px solid rgba(180,228,255,.4)}
.tc-key input{background:rgba(2,61,94,.8);border:1px solid rgba(180,228,255,.5);color:#c1e8fe;border-radius:4px}
.tc-key button{background:#53b8f0;border-radius:4px}.tc-key button[type=button]{background:#5f95b4}
.tc-btns button{background:linear-gradient(135deg,rgba(83,188,247,.28),rgba(7,125,192,.4));border:1px solid rgba(190,231,255,.7);border-left:3px solid #a2ddff;color:#c1e8fe;border-radius:4px;font-weight:600}
.tc-btns button:hover:not(:disabled){box-shadow:0 0 14px rgba(150,217,254,.6);background:linear-gradient(135deg,rgba(111,203,255,.45),rgba(20,155,230,.55))}
.tc-btns button.picked{background:linear-gradient(135deg,#54bcf7,#8cd5fe);color:#004a74;border-color:#c1e8fe}
.toto-hint{background:linear-gradient(160deg,rgba(9,92,139,.9),rgba(4,69,106,.92));color:#c1e8fe;border:1px solid rgba(190,231,255,.8);border-radius:6px;box-shadow:0 0 18px rgba(130,209,255,.55),inset 0 0 14px rgba(130,209,255,.15);text-shadow:0 0 8px rgba(161,221,255,.6)}
.toto-hint:after{border-right:1px solid rgba(190,231,255,.8);border-bottom:1px solid rgba(190,231,255,.8);background:rgba(4,69,106,.95)}
@media (prefers-reduced-motion:reduce){.toto-chat:before,.toto-chat:after,.tc-dot:before,.tc-dot:after{animation:none}}

/* ===== 全息投影对话框（透明悬浮版） ===== */
.toto-chat{background:linear-gradient(170deg,rgba(6,89,136,.5),rgba(2,58,90,.62));backdrop-filter:blur(5px) saturate(1.5);-webkit-backdrop-filter:blur(5px) saturate(1.5);border:1px solid rgba(180,228,255,.28);border-radius:6px;box-shadow:0 0 30px rgba(119,206,255,.4),inset 0 0 60px rgba(119,206,255,.1);animation:none}
.toto-chat.open{animation:tcBoot .55s cubic-bezier(.2,.9,.2,1) both,tcFlick 6s 1s infinite}
@keyframes tcFlick{0%,100%{opacity:1}47%{opacity:1}48%{opacity:.9}49%{opacity:1}81%{opacity:1}82%{opacity:.93}83%{opacity:1}}
.toto-chat:before{border-radius:6px}
.toto-chat:after{border-radius:6px}
.tc-corner{position:absolute;width:20px;height:20px;z-index:7;pointer-events:none;border:0 solid #c1e8fe;filter:drop-shadow(0 0 5px #a1ddff)}
.tc-corner.a{left:-1px;top:-1px;border-width:2.5px 0 0 2.5px}.tc-corner.b{right:-1px;top:-1px;border-width:2.5px 2.5px 0 0}
.tc-corner.c{left:-1px;bottom:-1px;border-width:0 0 2.5px 2.5px}.tc-corner.d{right:-1px;bottom:-1px;border-width:0 2.5px 2.5px 0}
.tc-head{padding:6px 14px 8px 8px;background:linear-gradient(90deg,rgba(111,203,255,.22),transparent 80%);border-bottom:1px solid rgba(180,228,255,.35)}
.tc-holo{position:relative;width:60px;height:60px;flex:none;margin:-2px 2px -6px 0}
.tc-holo canvas{position:absolute;inset:0;width:60px;height:60px;display:block}
.tc-disk{position:absolute;left:6px;right:6px;bottom:-1px;height:10px;border-radius:50%;background:radial-gradient(closest-side,rgba(193,232,254,.95),rgba(150,217,254,.5) 55%,transparent);animation:diskPulse 1.8s ease-in-out infinite}
@keyframes diskPulse{50%{opacity:.55;transform:scaleX(.88)}}
.tc-title{margin-left:4px}
.tc-msg.bot{background:linear-gradient(90deg,rgba(111,203,255,.14),transparent);border:0;border-left:2px solid #a2ddff;border-radius:0;box-shadow:none;text-shadow:0 0 8px rgba(161,221,255,.55);padding:7px 10px 7px 12px}
.tc-msg.me{background:linear-gradient(270deg,rgba(255,190,80,.22),transparent);color:#ffe9b8;font-weight:600;border:0;border-right:2px solid #ffd070;border-radius:0;box-shadow:none;text-shadow:0 0 8px rgba(255,200,100,.6);text-align:right}
.tc-form{background:transparent;border-top:1px solid rgba(180,228,255,.3)}
.tc-form input{background:rgba(4,72,110,.45);border:0;border-bottom:1.5px solid rgba(190,231,255,.8);border-radius:0;box-shadow:none}
.tc-form button{background:rgba(83,188,247,.2);border:1px solid #c1e8ff;border-radius:0;color:#c1e8fe;box-shadow:0 0 10px rgba(141,213,254,.45)}
.tc-btns button{background:rgba(83,188,247,.14);border-radius:0;border-width:1px 1px 1px 2px}
.tc-quick button{background:rgba(83,188,247,.14);border-radius:0}
@media (prefers-reduced-motion:reduce){.tc-disk{animation:none}}
.toto-chat{background:linear-gradient(170deg,rgba(6,91,139,.66),rgba(2,60,92,.78))}
.tc-holo,.tc-holo canvas{width:68px;height:68px}.tc-holo{margin:-4px 0 -8px 0}

.tc-holo,.tc-holo canvas{width:68px;height:68px}.tc-holo{margin:-4px 0 -8px 0}
.tc-holo canvas{filter:drop-shadow(0 3px 5px rgba(11,72,107,.45))}
.toto-chat{background:linear-gradient(170deg,rgba(20,95,138,.7),rgba(10,59,86,.82))}

/* 浅蓝透明版 */
.toto-chat{background:linear-gradient(170deg,rgba(150,215,255,.34),rgba(80,160,240,.40));backdrop-filter:blur(9px) saturate(1.3);-webkit-backdrop-filter:blur(9px) saturate(1.3);color:#fff;border-color:rgba(220,245,255,.75);box-shadow:0 0 26px rgba(120,210,255,.55),inset 0 0 50px rgba(200,235,255,.22)}

/* 提高不透明度，保证文字清晰 */
.toto-chat{background:linear-gradient(170deg,rgba(70,150,230,.90),rgba(38,105,200,.94));backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.tc-msg.bot{background:linear-gradient(90deg,rgba(255,255,255,.2),rgba(255,255,255,.06))}
.tc-msg.me{background:linear-gradient(270deg,rgba(255,170,60,.5),rgba(255,170,60,.12))}
.tc-form input{background:rgba(255,255,255,.2)}
.toto-hint{background:linear-gradient(160deg,rgba(70,150,230,.94),rgba(45,115,205,.96))}
.toto-hint:after{background:rgba(50,120,208,.96)}
#pickLayer{position:absolute;left:0;top:0;width:1360px;height:768px;transform-origin:0 0;z-index:6;pointer-events:none}
.pick{position:absolute;top:170px;width:150px;height:190px;pointer-events:none;perspective:760px;perspective-origin:50% 40%;opacity:0}
.pick.on{pointer-events:auto;animation:pickIn .75s cubic-bezier(.2,.9,.25,1.12) var(--dl) both}
.pick.off{animation:pickOut .35s ease-in var(--dl2) both;pointer-events:none}
@keyframes pickIn{0%{opacity:0;transform:translate(var(--fx),160px) scale(.15) rotateX(70deg)}100%{opacity:1;transform:none}}
@keyframes pickOut{0%{opacity:1;transform:none}100%{opacity:0;transform:translate(var(--fx),160px) scale(.15)}}
.pk-float{position:absolute;inset:0;transform-style:preserve-3d;animation:pkBob 4.2s ease-in-out var(--bd) infinite}
@keyframes pkBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
.pk-box{position:absolute;inset:0;transform-style:preserve-3d;transform:rotateX(var(--tx,0deg)) rotateY(var(--ty,var(--ry)));transition:transform .45s cubic-bezier(.2,.8,.2,1);cursor:pointer;outline:0}
.pick.hov .pk-box{transition:transform .12s linear}
/* 厚度（深度 24px）*/
.pk-f,.pk-b,.pk-s{position:absolute;backface-visibility:hidden}
.pk-f{inset:0;transform:translateZ(12px);border-radius:14px;overflow:hidden;font-family:"PingFang SC","Microsoft YaHei",sans-serif;color:#eafaff;
  background:radial-gradient(120% 80% at 50% 0%,rgba(70,170,255,.38),transparent 60%),linear-gradient(165deg,#12397a 0%,#0a2158 55%,#0b3470 100%);
  box-shadow:inset 0 0 0 1.5px rgba(140,235,255,.9),inset 0 0 30px rgba(70,190,255,.35),0 0 26px rgba(60,200,255,.55)}

(function(){
  function hull(P){P=P.slice().sort((a,b)=>a[0]-b[0]||a[1]-b[1]);const cr=(o,a,b)=>(a[0]-o[0])*(b[1]-o[1])-(a[1]-o[1])*(b[0]-o[0]);const lo=[];for(const p of P){while(lo.length>1&&cr(lo[lo.length-2],lo[lo.length-1],p)<=0)lo.pop();lo.push(p);}const up=[];for(let i=P.length-1;i>=0;i--){const p=P[i];while(up.length>1&&cr(up[up.length-2],up[up.length-1],p)<=0)up.pop();up.push(p);}up.pop();lo.pop();return lo.concat(up);}
  function hit(ev){
    if(pTarget!==1||pA<.9||!hitPts)return false;
    const r=cv.getBoundingClientRect(),x=ev.clientX-r.left,y=ev.clientY-r.top;
    const H=hull(hitPts);let mx=0,my=0;H.forEach(p=>{mx+=p[0]/H.length;my+=p[1]/H.length;});
    const G=H.map(p=>[mx+(p[0]-mx)*1.45,my+(p[1]-my)*1.45]);
    let inside=false;for(let i=0,j=G.length-1;i<G.length;j=i++){const a=G[i],b=G[j];if((a[1]>y)!==(b[1]>y)&&x<(b[0]-a[0])*(y-a[1])/(b[1]-a[1])+a[0])inside=!inside;}
    return inside;
  }
  const room=document.getElementById('polylab-room')||document.body;let cur=false;
  addEventListener('pointermove',e=>{const h=hit(e);if(h!==cur){cur=h;room.style.cursor=h?'pointer':'';}},{passive:true});
  addEventListener('click',e=>{if(hit(e)){pTarget=0;room.style.cursor='';cur=false;dispatchEvent(new CustomEvent('bench:pentagon'));}});
  addEventListener('bench:restore',()=>{pTarget=1;});
})();

(function(){

<script>
/* 墙面三幅立体密铺：盖住原图里的图案，用代码重新生成（立体方块 / 八角星花窗 / 球面三六密铺） */
(function(){

/* 带倒角的立体瓷砖：渐变面 + 亮边/暗边 + 高光 */
function tile(g,pts,base,sc,gap){
  let cx=0,cy=0;pts.forEach(p=>{cx+=p[0];cy+=p[1];});cx/=pts.length;cy/=pts.length;
  const k=1-(gap||0.05);const P=pts.map(p=>[cx+(p[0]-cx)*k,cy+(p[1]-cy)*k]);

  gr.addColorStop(0,rgb(lighten(base,.32)));gr.addColorStop(.5,rgb(base));gr.addColorStop(1,rgb(darken(base,.3)));
  g.beginPath();P.forEach((p,i)=>i?g.lineTo(p[0],p[1]):g.moveTo(p[0],p[1]));g.closePath();g.fillStyle=gr;g.fill();
  /* 柔和高光 */
  g.save();g.clip();
  const hg=g.createRadialGradient(x0+(x1-x0)*.3,y0+(y1-y0)*.25,0,x0+(x1-x0)*.3,y0+(y1-y0)*.25,Math.max(x1-x0,y1-y0)*.75);

/* ① 立体方块（tumbling blocks）*/
const PAL1=[[64,132,246],[247,166,40],[30,190,176],[240,104,92]];
function drawCubes(g,w,h){
  const R=46*SS/3*1.0,hw=Math.sqrt(3)*R;
  g.fillStyle='#14305e';g.fillRect(0,0,w,h);
  for(let j=-1;j<h/(1.5*R)+2;j++)for(let i=-1;i<w/hw+2;i++){

/* ② 八角星花窗（4.8.8 截角方格 + 八角星）*/
function drawStars(g,w,h){
  const P=100*SS/3,a=P/(1+Math.SQRT2),Rc=a/(2*Math.sin(Math.PI/8));
  g.fillStyle='#16335f';g.fillRect(0,0,w,h);

  for(let j=-1;j<h/P+2;j++)for(let i=-1;i<w/P+2;i++){
    const cx=i*P+P*.2,cy=j*P+P*.1,base=A[((i+j)%2+2)%2];
    const oct=[];for(let k=0;k<8;k++){const t=(22.5+45*k)*Math.PI/180;oct.push([cx+Rc*Math.cos(t),cy+Rc*Math.sin(t)]);}

/* ③ 立体棱锥密铺：每个三角形被切成三个受光不同的小面，像一片切面宝石 */

/* ---- 四点透视（CSS matrix3d）---- */
function homography(w,h,q){      /* 单位矩形(0,0)(w,0)(w,h)(0,h) → 四边形 q */
  const src=[[0,0],[w,0],[w,h],[0,h]],A=[],b=[];
  for(let i=0;i<4;i++){const [x,y]=src[i],[X,Y]=q[i];A.push([x,y,1,0,0,0,-x*X,-y*X]);b.push(X);A.push([0,0,0,x,y,1,-x*Y,-y*Y]);b.push(Y);}
  for(let c=0;c<8;c++){let m=c;for(let r=c+1;r<8;r++)if(Math.abs(A[r][c])>Math.abs(A[m][c]))m=r;[A[c],A[m]]=[A[m],A[c]];[b[c],b[m]]=[b[m],b[c]];
    for(let r=c+1;r<8;r++){const f=A[r][c]/A[c][c];for(let k=c;k<8;k++)A[r][k]-=f*A[c][k];b[r]-=f*b[c];}}

  const [a,bb,c,d,e,f,gg,hh]=x;
  return 'matrix3d('+[a,d,0,gg,bb,e,0,hh,0,0,1,0,c,f,0,1].join(',')+')';
}

  g.font=font.replace('{s}',fs+'px');g.textBaseline='middle';

  const gr=g.createLinearGradient(0,-fs/2,0,fs/2);gr.addColorStop(0,col[0]);gr.addColorStop(1,col[1]);g.fillStyle=gr;
  g.fillText(text,0,0);layer.appendChild(cv);

<script>
/* 点击台面正五边形 → 五边形隐藏，浮出三个全息选择框 */
(function(){

const ITEMS=[
  {id:'mosaic',no:'01',name:'镶嵌组合密铺',sub:'MOSAIC · TILING',ry:'16deg', x:439,dl:'.05s'},
  {id:'morph', no:'02',name:'变形组合密铺',sub:'MORPH · TILING', ry:'0deg',  x:603,dl:'.15s'},

/* ---- 卡片里的旋转立体正五边形（薄板 + 光晕 + 轨道环 + 粒子），与工作台上的那块同款 ---- */
const TAU=Math.PI*2,PCW=140,PCH=116,PDPR=3;
const TINTS=[[96,206,255],[190,150,255],[255,205,110]];
const mixc=(a,b,k)=>[a[0]+(b[0]-a[0])*k,a[1]+(b[1]-a[1])*k,a[2]+(b[2]-a[2])*k];
const rc=(c,a)=>'rgba('+(c[0]|0)+','+(c[1]|0)+','+(c[2]|0)+','+a+')';
function Penta(cv,tint,phase){
  cv.width=PCW*PDPR;cv.height=PCH*PDPR;const g=cv.getContext('2d');
  const PT=.1,D=4.2,L=(()=>{const v=[-.35,.6,.72],l=Math.hypot(...v);return v.map(a=>a/l);})();
  const loc=[];for(const z of[PT,-PT])for(let i=0;i<5;i++){const a=Math.PI/2+i*TAU/5;loc.push([Math.cos(a),Math.sin(a),z]);}
  const FACES=[[0,1,2,3,4],[9,8,7,6,5]];for(let i=0;i<5;i++)FACES.push([i,(i+1)%5,5+(i+1)%5,5+i]);
  const parts=Array.from({length:16},(_,i)=>({a:Math.random()*TAU,r:.9+Math.random()*.9,p:Math.random(),sp:.12+Math.random()*.2,z:Math.random()*2-1}));
  this.draw=function(t){
    t+=phase;const W=cv.width,H=cv.height,S=H*.30,cx=W/2,cy=H*.52;
    g.setTransform(1,0,0,1,0,0);g.clearRect(0,0,W,H);
    const yaw=t*1.0,tl=.34+.1*Math.sin(t*.7),cyw=Math.cos(yaw),syw=Math.sin(yaw),ct=Math.cos(tl),st=Math.sin(tl);
    const rot=(p)=>{const x1=p[0]*cyw+p[2]*syw,z1=-p[0]*syw+p[2]*cyw;return[x1,p[1]*ct-z1*st,p[1]*st+z1*ct];};
    const proj=v=>{const f=D/(D-v[2]);return[cx+v[0]*S*f,cy-v[1]*S*f,v[2]];};
    const bob=Math.sin(t*1.5)*.04;
    const R=loc.map(p=>{const v=rot(p);v[1]+=bob;return v;}),P=R.map(proj);
    /* 光晕 */
    g.save();g.globalCompositeOperation='lighter';
    let gr=g.createRadialGradient(cx,cy,0,cx,cy,S*1.9);gr.addColorStop(0,rc(tint,.5));gr.addColorStop(.45,rc(tint,.16));gr.addColorStop(1,rc(tint,0));
    g.fillStyle=gr;g.fillRect(0,0,W,H);g.restore();
    /* 轨道环（后半） */
    const ring=(rr,inc,sp,back)=>{
      g.save();g.globalCompositeOperation='lighter';g.lineCap='round';
      const N=60;let pts=[];
      for(let i=0;i<=N;i++){const a=i/N*TAU,x=rr*Math.cos(a),z0=rr*Math.sin(a),y=-z0*Math.sin(inc),z=z0*Math.cos(inc);
        const x2=x*Math.cos(sp)+z*Math.sin(sp),z2=-x*Math.sin(sp)+z*Math.cos(sp);const v=[x2,y+bob,z2];pts.push(proj(v));}
      for(let i=0;i<N;i++){const a=pts[i],b=pts[i+1],front=(a[2]+b[2])/2>=0;if(front===back)continue;
        g.beginPath();g.moveTo(a[0],a[1]);g.lineTo(b[0],b[1]);g.strokeStyle=rc(tint,back?.28:.55);g.lineWidth=(back?1.2:1.6)*PDPR;g.stroke();
        g.strokeStyle=rc(tint,back?.07:.14);g.lineWidth=5*PDPR;g.stroke();}
      g.restore();
    };
    const sat=(rr,inc,sp,ph)=>{const a=ph,x=rr*Math.cos(a),z0=rr*Math.sin(a),y=-z0*Math.sin(inc),z=z0*Math.cos(inc);
      const x2=x*Math.cos(sp)+z*Math.sin(sp),z2=-x*Math.sin(sp)+z*Math.cos(sp);return proj([x2,y+bob,z2]);};
    ring(1.55,.9,t*.5,true);ring(1.3,-.55,-t*.6,true);
    /* 粒子（后） */
    const drawParts=(front)=>{g.save();g.globalCompositeOperation='lighter';parts.forEach(q=>{
      const ph=(q.p+t*q.sp)%1,a=q.a+t*.3,x=q.r*Math.cos(a),z=q.r*Math.sin(a),y=-1.2+ph*2.4;
      const pp=proj([x,y,z*.6]);if((pp[2]>=0)!==front)return;
      const al=Math.sin(ph*Math.PI)*.8;g.fillStyle=rc(mixc(tint,[255,255,255],.5),al);g.beginPath();g.arc(pp[0],pp[1],(1+q.z*.4+.6)*PDPR,0,TAU);g.fill();});g.restore();};
    drawParts(false);
    /* 五边形板：背面剔除 + 画家算法 */
    const items=[];
    FACES.forEach((ids,fi)=>{
      let nx=0,ny=0,nz=0,mx=0,my=0,mz=0;
      for(let k=0;k<ids.length;k++){const a=R[ids[k]],b=R[ids[(k+1)%ids.length]];nx+=(a[1]-b[1])*(a[2]+b[2]);ny+=(a[2]-b[2])*(a[0]+b[0]);nz+=(a[0]-b[0])*(a[1]+b[1]);mx+=a[0];my+=a[1];mz+=a[2];}
      const l=Math.hypot(nx,ny,nz)||1;nx/=l;ny/=l;nz/=l;mx/=ids.length;my/=ids.length;mz/=ids.length;
      if(nx*mx+ny*(my-bob)+nz*mz<0){nx=-nx;ny=-ny;nz=-nz;}
      if(nz<=0.02)return;
      items.push({z:mz,ids,lt:.3+.7*Math.max(0,nx*L[0]+ny*L[1]+nz*L[2]),fi});
    });
    items.sort((a,b)=>a.z-b.z);
    items.forEach(it=>{
      const q=it.ids.map(i=>P[i]);
      g.beginPath();q.forEach((p,i)=>i?g.lineTo(p[0],p[1]):g.moveTo(p[0],p[1]));g.closePath();
      const col=mixc(mixc([14,40,100],tint,.7),[255,255,255],Math.min(1,it.lt*.32));
      g.fillStyle=rc(mixc(col,tint,.1),.94);g.fill();
      if(it.fi<2){ /* 正面：流光扫过 */
        g.save();g.clip();const sw=((t*.55)%1.6-.3);let x0=cx-S+sw*2*S;
        const sg=g.createLinearGradient(x0-S*.5,cy-S,x0+S*.5,cy+S);sg.addColorStop(0,'rgba(255,255,255,0)');sg.addColorStop(.5,'rgba(255,255,255,.5)');sg.addColorStop(1,'rgba(255,255,255,0)');
        g.fillStyle=sg;g.fillRect(0,0,W,H);
        const hg=g.createRadialGradient(cx-S*.3,cy-S*.4,0,cx-S*.3,cy-S*.4,S*1.2);hg.addColorStop(0,'rgba(255,255,255,.28)');hg.addColorStop(1,'rgba(255,255,255,0)');g.fillStyle=hg;g.fillRect(0,0,W,H);
        g.restore();
      }
      g.save();g.lineJoin='round';g.strokeStyle=rc(tint,.35);g.lineWidth=5*PDPR;g.beginPath();q.forEach((p,i)=>i?g.lineTo(p[0],p[1]):g.moveTo(p[0],p[1]));g.closePath();g.stroke();
      g.strokeStyle='rgba(236,252,255,.95)';g.lineWidth=1.5*PDPR;g.stroke();g.restore();
    });
    /* 轨道环（前半）+ 卫星 + 粒子（前） */
    ring(1.55,.9,t*.5,false);ring(1.3,-.55,-t*.6,false);
    [[1.55,.9,t*.5,t*1.3],[1.3,-.55,-t*.6,-t*1.6+2]].forEach(o=>{const p=sat(...o);
      g.save();g.globalCompositeOperation='lighter';const rr=7*PDPR,sg=g.createRadialGradient(p[0],p[1],0,p[0],p[1],rr);
      sg.addColorStop(0,'rgba(255,255,255,1)');sg.addColorStop(.4,rc(tint,.8));sg.addColorStop(1,rc(tint,0));g.fillStyle=sg;g.beginPath();g.arc(p[0],p[1],rr,0,TAU);g.fill();g.restore();});
    drawParts(true);
  };
}
const els=[];const pents=[];
ITEMS.forEach((it,i)=>{
  const d=document.createElement('div');d.className='pick';d.style.left=it.x+'px';

  const box=d.querySelector('.pk-box');pents.push(new Penta(d.querySelector('.pk-pent'),TINTS[i],i*1.7));

<script>
/* 镶嵌组合密铺 · 画布：一块正五边形 → 向拓拓提问 → 两种方案 → 图形库 → 克隆 / 吸附 / 自动密铺 */
(function(){
const root=document.getElementById('polylab-room')||document.body;
const TAU=Math.PI*2,D2R=Math.PI/180,L0=44;           /* L0：初始图形边长（px）*/
const $=(s,r)=> (r||document).querySelector(s);

/* ================= 几何 ================= */
const cen=p=>{let x=0,y=0;p.forEach(q=>{x+=q.x;y+=q.y;});return{x:x/p.length,y:y/p.length};};
const area=p=>{let a=0;for(let i=0;i<p.length;i++){const q=p[(i+1)%p.length];a+=p[i].x*q.y-q.x*p[i].y;}return a/2;};
const orient=p=>area(p)<0?p.slice().reverse():p;       /* 统一为同一绕向，吸附时相邻图形共享边方向相反 */
const reg=(n,side,rot)=>{const R=side/(2*Math.sin(Math.PI/n)),o=[];for(let k=0;k<n;k++){const a=rot+k*TAU/n;o.push({x:R*Math.cos(a),y:R*Math.sin(a)});}return orient(o);};
const mkPent=s=>reg(5,s,-Math.PI/2);
const mkHex=s=>reg(6,s,Math.PI/6);
const mkSq=s=>reg(4,s,Math.PI/4);
const mkTri=s=>{const o=reg(3,s,-Math.PI/2);return o;};
const mkRh=s=>{const u={x:s,y:0},v={x:s*Math.cos(36*D2R),y:s*Math.sin(36*D2R)};const o=[{x:0,y:0},u,{x:u.x+v.x,y:u.y+v.y},v];const c=cen(o);return orient(o.map(p=>({x:p.x-c.x,y:p.y-c.y})));};
const mv=(p,dx,dy)=>p.map(q=>({x:q.x+dx,y:q.y+dy}));
const rotAbout=(p,c,a)=>{const co=Math.cos(a),si=Math.sin(a);return p.map(q=>({x:c.x+(q.x-c.x)*co-(q.y-c.y)*si,y:c.y+(q.x-c.x)*si+(q.y-c.y)*co}));};
const inPoly=(p,x,y)=>{let r=false;for(let i=0,j=p.length-1;i<p.length;j=i++){const a=p[i],b=p[j];if((a.y>y)!==(b.y>y)&&x<(b.x-a.x)*(y-a.y)/(b.y-a.y)+a.x)r=!r;}return r;};
const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
const inR=p=>{const c=cen(p);let m=1e9;for(let i=0;i<p.length;i++){const a=p[i],b=p[(i+1)%p.length],dx=b.x-a.x,dy=b.y-a.y,l=Math.hypot(dx,dy);m=Math.min(m,Math.abs((c.x-a.x)*dy-(c.y-a.y)*dx)/l);}return m;};

/* ================= 自动密铺（正五边形 + 36°菱形，边对边，顶点只允许 108+108+108+36 或 108+108+144 等合法拼法）================= */
function growPatch(limit){
  const VT=[];for(let p=0;p<4;p++)for(let q=0;q<11;q++)for(let r=0;r<3;r++)if(108*p+36*q+144*r===360&&p+q+r>=2){const t=[];for(let i=0;i<p;i++)t.push(108);for(let i=0;i<q;i++)t.push(36);for(let i=0;i<r;i++)t.push(144);VT.push(t);}
  const key=z=>Math.round(z.x*1000)+','+Math.round(z.y*1000),COORD=new Map(),E=d=>({x:Math.cos(d*D2R),y:Math.sin(d*D2R)});
  const tiles=[],edges=new Map(),vang=new Map();
  const okms=ms=>{let tot=0;for(const a of ms)tot+=a;if(tot>360)return false;
    for(const T of VT){const t=T.slice();let g=true;for(const a of ms){const i=t.indexOf(a);if(i<0){g=false;break;}t.splice(i,1);}if(g)return true;}return false;};
  const ovl=(P,Q)=>{for(const poly of[P,Q]){const n=poly.length;for(let i=0;i<n;i++){const e={x:poly[(i+1)%n].x-poly[i].x,y:poly[(i+1)%n].y-poly[i].y},l=Math.hypot(e.x,e.y),ax={x:-e.y/l,y:e.x/l};
    let a0=1e9,a1=-1e9,b0=1e9,b1=-1e9;for(const v of P){const d=v.x*ax.x+v.y*ax.y;a0=Math.min(a0,d);a1=Math.max(a1,d);}for(const v of Q){const d=v.x*ax.x+v.y*ax.y;b0=Math.min(b0,d);b1=Math.max(b1,d);}
    if(a1<=b0+1e-6||b1<=a0+1e-6)return false;}}return true;};
  const EXT={P:[72,72,72,72,72],A:[144,36,144,36],B:[36,144,36,144]},INT={P:[108,108,108,108,108],A:[36,144,36,144],B:[144,36,144,36]};

function edges(p){const o=[];for(let i=0;i<p.length;i++)o.push({a:p[i],b:p[(i+1)%p.length]});return o;}

  const thr=L0*.3,others=shapes.filter(o=>o!==s&&!o.auto);let best=null;
  /* 五边形/容器的"镶嵌"：中心对齐 */
  const c=cen(s.pts);
  if(s.type==='P'){for(const o of others){if(o.dockPts){const di=dockInfo(s,o);if(di.d<L0*.6)return{kind:'dock',tgt:di.dc,fn:p=>mv(rotAbout(p,di.pc,-di.da),di.dc.x-di.pc.x,di.dc.y-di.pc.y)};}}}
  else if(s.dockPts){for(const o of others){if(o.type==='P'&&!o.parts){const di=dockInfo(o,s);if(di.d<L0*.6)return{kind:'dock',tgt:di.pc,fn:p=>mv(rotAbout(p,di.dc,di.da),di.pc.x-di.dc.x,di.pc.y-di.dc.y)};}}}

function autoTile(){
  if(!plan){window.TotoChat&&TotoChat.say('先在对话框里问问我，怎么让这块正五边形铺满平面吧～');return;}
  const Wd=W,Hd=H,cx=Wd/2,cy=Hd/2,now=performance.now();let out=[];
  if(plan===3){
    const base=shapes.find(o=>o.type==='C'&&!o.auto);

    const o=base.pts;let v1,v2;
    if(base.cont==='S'){v1={x:o[1].x-o[0].x,y:o[1].y-o[0].y};v2={x:o[2].x-o[1].x,y:o[2].y-o[1].y};}
    else{const c=cen(o),m0={x:(o[0].x+o[1].x)/2,y:(o[0].y+o[1].y)/2},m1={x:(o[1].x+o[2].x)/2,y:(o[1].y+o[2].y)/2};v1={x:2*(m0.x-c.x),y:2*(m0.y-c.y)};v2={x:2*(m1.x-c.x),y:2*(m1.y-c.y)};}
    const bc=cen(o),N=Math.ceil(Math.hypot(Wd,Hd)/Math.min(Math.hypot(v1.x,v1.y),Math.hypot(v2.x,v2.y)))+2;
    for(let i=-N;i<=N;i++)for(let j=-N;j<=N;j++){const dx=i*v1.x+j*v2.x,dy=i*v1.y+j*v2.y,px=bc.x+dx,py=bc.y+dy;if(px<-90||px>Wd+90||py<-90||py>Hd+90)continue;
      out.push(newShape('C',mv(o,dx,dy),{z:1,cont:base.cont,auto:true,delay:dist({x:px,y:py},{x:cx,y:cy})*2.2,parts:base.parts.map(q=>({type:q.type,pts:mv(q.pts,dx,dy)}))}));}
  }else if(plan===1){
    const Ls=Math.max(17,Math.min(Wd/34,Hd/24));
    const Rr=Math.hypot(Wd,Hd)/2/Ls+3;
    const patch=growPatch(Math.ceil(Math.PI*Rr*Rr/1.25)+80);
    let mx=0,my=0,nn=0;patch.forEach(t=>{const c=cen(t.pts);mx+=c.x;my+=c.y;nn++;});mx/=nn;my/=nn;
    patch.forEach(t=>{
      const pts=t.pts.map(q=>({x:cx+(q.x-mx)*Ls,y:cy-(q.y-my)*Ls}));      /* y 翻转，保持绕向一致 */
      const c=cen(pts);if(c.x<-Ls*2||c.x>Wd+Ls*2||c.y<-Ls*2||c.y>Hd+Ls*2)return;
      out.push(newShape(t.kind==='P'?'P':'R',orient(pts),{auto:true,delay:dist(c,{x:cx,y:cy})*2.4}));
    });
  }else{
    const type=lastBox||'H',Ls=Math.max(15,Math.min(Wd/44,Hd/30));let boxes=[];

    if(type==='H'){const s=Lc*1.25,w=Math.sqrt(3)*s,rowh=1.5*s;
      for(let j=-2;j*rowh<Hd+rowh;j++)for(let i=-2;i*w<Wd+w;i++){const x=i*w+(j&1?w/2:0)+(Wd%w)/2,y=j*rowh+rowh*.5;boxes.push({type:'H',pts:mv(reg(6,s,Math.PI/6),x,y),k:(i+j)});}}
    else if(type==='S'){const s=Lc*1.9;for(let j=-1;j*s<Hd+s;j++)for(let i=-1;i*s<Wd+s;i++)boxes.push({type:'S',pts:mv(mkSq(s),i*s+s/2,j*s+s/2),k:i+j});}
    else{const s=Lc*3.15,hh=s*Math.sqrt(3)/2;
      for(let j=-1;j*hh<Hd+hh;j++)for(let i=-2;i*s<Wd+s;i++){for(const up of[0,1]){const x0=i*s+(j&1?s/2:0),y0=j*hh;const a=up?{x:x0,y:y0+hh}:{x:x0+s/2,y:y0},b=up?{x:x0+s,y:y0+hh}:{x:x0+s*1.5,y:y0},c=up?{x:x0+s/2,y:y0}:{x:x0+s,y:y0+hh};boxes.push({type:'T',pts:orient([a,b,c]),k:i+j+up});}}}
    boxes.forEach(b=>{const c=cen(b.pts);if(c.x<-Lc*3||c.x>Wd+Lc*3||c.y<-Lc*3||c.y>Hd+Lc*3)return;const dl=dist(c,{x:cx,y:cy})*1.6;
      out.push(newShape(b.type,b.pts,{auto:true,z:0,delay:dl}));
      const rot=(b.k&1)?36*D2R:0;let P=mkPent(Lc);P=rotAbout(P,{x:0,y:0},rot);P=mv(P,c.x,c.y);
      out.push(newShape('P',P,{auto:true,z:1,delay:dl+90}));});
  }
  shapes=out;sel=null;snapHint=null;updateInfo();
  const st=$('#labState');if(st)st.innerHTML='<i></i>自动密铺完成';
  dispatchEvent(new CustomEvent('lab:done',{detail:{id:mode}}));
  window.TotoChat&&TotoChat.say(plan===3?'铺满啦！每一块「正五边形 + 配套块」合起来就是一整块'+(shapes.length&&out[0]&&out[0].cont==='S'?'正方形':'正六边形')+'，而它自己本来就能无缝密铺，所以整张画布就严丝合缝了～想换另一种配套块，点「重置」再来一次吧！':plan===1?'看，铺满啦！每个顶点周围要么是「3 个五边形 + 1 个 36° 的小角」，要么是「2 个五边形 + 1 个 144° 的大角」，加起来都刚好 360°。想自己再摆一遍，点「重置」就行～':'铺满啦！每个容器里都镶着一个正五边形，容器本身能密铺，所以整张画布就铺满了。想换别的容器试试，点「重置」再从图形库里选一个吧～');
}

function thumb(type,mk,ghost){
  const c=document.createElement('canvas');c.width=300;c.height=156;const x=c.getContext('2d');
  let pts=mk();const cc=cen(pts);let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;pts.forEach(p=>{x0=Math.min(x0,p.x);y0=Math.min(y0,p.y);x1=Math.max(x1,p.x);y1=Math.max(y1,p.y);});
  const k=Math.min(240/(x1-x0),120/(y1-y0));pts=pts.map(p=>({x:150+(p.x-cc.x)*k,y:78+(p.y-cc.y)*k}));
  const col=type==='R'?[255,190,70]:colorFor(type,pts);const gr=x.createLinearGradient(0,0,300,156);gr.addColorStop(0,rgba(mixw(col,.45),.98));gr.addColorStop(1,rgba(mixk(col,.15),.98));
  x.beginPath();pts.forEach((p,i)=>i?x.lineTo(p.x,p.y):x.moveTo(p.x,p.y));x.closePath();
  const box=(type==='H'||type==='S'||type==='T');
  if(box){x.fillStyle=rgba(mixw(col,.1),.5);x.fill();x.strokeStyle=rgba(mixw(col,.6),1);x.lineWidth=3;x.stroke();
    const ps=mkPent(L0);const pc=cen(ps);const kk=k;const pp=ps.map(p=>({x:150+(p.x-pc.x)*kk,y:78+(p.y-pc.y)*kk}));
    x.beginPath();pp.forEach((p,i)=>i?x.lineTo(p.x,p.y):x.moveTo(p.x,p.y));x.closePath();x.setLineDash([6,5]);x.strokeStyle='rgba(255,255,255,.75)';x.lineWidth=2;x.stroke();x.setLineDash([]);
  }else{x.fillStyle=gr;x.fill();x.strokeStyle='rgba(240,252,255,.95)';x.lineWidth=3;x.stroke();
    if(ghost){const gp=ghost().map(p=>({x:150+(p.x-cc.x)*k,y:78+(p.y-cc.y)*k}));x.beginPath();gp.forEach((p,i)=>i?x.lineTo(p.x,p.y):x.moveTo(p.x,p.y));x.closePath();x.fillStyle='rgba(64,222,235,.35)';x.fill();x.setLineDash([6,5]);x.strokeStyle='rgba(255,255,255,.9)';x.lineWidth=2;x.stroke();x.setLineDash([]);}}
  return c;
}

function polyP(P){g.beginPath();P.forEach((p,i)=>i?g.lineTo(p.x,p.y):g.moveTo(p.x,p.y));g.closePath();}

function drawPoly3(vw,pts3,anchor,e,spinAxis,alphaBase,style){
  /* e：0→1 拼合进度；返回屏幕多边形 */
  const out=e>=1?pts3:pts3.map(p=>{let q=sub(p,anchor);if(spinAxis)q=axisRot(q,spinAxis,(1-e)*1.4);const s=.35+.65*e;q=mul(q,s);const dir=norm(anchor),dd=(1-e)*2.4;return add(add(anchor,q),mul(dir,dd));});
  return out.map(vw.proj);
}
function drawBall(vw,m,T,opt){
  /* 足球 / 魔方：不透明体 + 全息描边 */
  const items=[];
  m.faces.forEach(f=>{
    const e=opt.full?1:easeOutBack(clamp((T-f.t0)/f.dur,0,1.0001)),raw=opt.full?1:clamp((T-f.t0)/f.dur,0,1);if(raw<=0)return;
    const ee=Math.min(1.08,e);
    const pr=drawPoly3(vw,f.pts,f.c,ee>1?1:ee,f.n,raw,0);
    const nr=rot(f.n,vw.y,vw.x);const cz=pr.reduce((a,p)=>a+p.z,0)/pr.length;
    items.push({f,pr,nr,cz,al:Math.min(1,raw*1.6)});
  });
  items.sort((a,b)=>b.cz-a.cz);
  /* 背面：淡淡的全息线框 */
  items.forEach(it=>{if(it.nr[2]<0)return;g.save();g.globalAlpha=.22*it.al;g.strokeStyle='#8defff';g.lineWidth=1;polyP(it.pr);g.stroke();g.restore();});
  items.forEach(it=>{
    if(it.nr[2]>=0)return;
    const sh=Math.max(0,dot(it.nr,LD)),k=.5+.5*sh,f=it.f;
    g.save();g.globalAlpha=it.al;
    if(m.id==='football'){
      const base=f.kind==='P'?'#1a2850':'#f1f8ff';
      polyP(it.pr);g.fillStyle=rgbs(base,f.kind==='P'?.7+.6*sh:.62+.38*sh);g.fill();
      /* 高光 */ if(f.kind==='H'){const c=it.pr.reduce((a,p)=>({x:a.x+p.x/it.pr.length,y:a.y+p.y/it.pr.length}),{x:0,y:0});const rg=g.createRadialGradient(c.x-4,c.y-4,1,c.x,c.y,vw.R*.34);rg.addColorStop(0,'rgba(160,235,255,'+(.25*sh)+')');rg.addColorStop(1,'rgba(160,235,255,0)');g.fillStyle=rg;g.fill();}
      g.shadowColor='#6fe6ff';g.shadowBlur=7;g.strokeStyle='rgba(140,240,255,.95)';g.lineWidth=1.6;g.lineJoin='round';polyP(it.pr);g.stroke();
    }else{
      polyP(it.pr);g.fillStyle='#0a0f20';g.fill();
      const P=f.pts,c=f.c,n=P.length,U=P.map(p=>add(c,mul(sub(p,c),.4)));
      const Ea=[],Eb=[];for(let i=0;i<n;i++){const a=P[i],b=P[(i+1)%n];Ea.push(lerp(a,b,.3));Eb.push(lerp(a,b,.7));}
      const stickers=[U];for(let i=0;i<n;i++){stickers.push([P[i],Ea[i],U[i],Eb[(i+n-1)%n]]);stickers.push([Ea[i],Eb[i],U[(i+1)%n],U[i]]);}
      const e2=opt.full?1:clamp((T-f.t0)/f.dur,0,1),anc=f.c;
      stickers.forEach(S3=>{const cc=cenOf(S3),S=S3.map(p=>add(cc,mul(sub(p,cc),.9)));
        const pp=(e2>=1?S:S.map(p=>{let q=sub(p,anc);q=axisRot(q,f.n,(1-e2)*1.4);q=mul(q,.35+.65*e2);return add(add(anc,q),mul(norm(anc),(1-e2)*2.4));})).map(vw.proj);
        polyP(pp);g.fillStyle=rgbs(f.col,.55+.45*sh);g.fill();});
      g.shadowColor='#bff6ff';g.shadowBlur=6;g.strokeStyle='rgba(200,248,255,.85)';g.lineWidth=1.3;g.lineJoin='round';polyP(it.pr);g.stroke();
    }
    g.restore();
  });
}
function drawWater(vw,m,T,opt){
  const items=[];
  m.cells.forEach(cl=>{
    const raw=opt.full?1:clamp((T-cl.t0)/cl.dur,0,1);if(raw<=0)return;const e=opt.full?1:easeOutBack(raw);
    const col=cl.t==='S'?[80,235,210]:[110,175,255];
    cl.faces.forEach(F=>{
      let P=F;if(e<1){const s=.25+.75*Math.min(1,e),dir=norm(cl.c),dd=(1-Math.min(1,e))*1.2;P=F.map(p=>add(add(cl.c,mul(sub(p,cl.c),s)),mul(dir,dd)));}
      const pr=P.map(vw.proj),cz=pr.reduce((a,p)=>a+p.z,0)/pr.length;
      const n=norm(cross(sub(P[1],P[0]),sub(P[2],P[0]))),nr=rot(n,vw.y,vw.x);
      items.push({pr,cz,nr,col,raw});
    });
  });
  items.sort((a,b)=>b.cz-a.cz);
  items.forEach(it=>{
    const sh=Math.abs(dot(it.nr,LD)),a=(.10+.20*sh)*Math.min(1,it.raw*1.6);
    g.save();polyP(it.pr);g.fillStyle='rgba('+it.col[0]+','+it.col[1]+','+it.col[2]+','+a+')';g.fill();
    g.shadowColor='rgba(120,230,255,.9)';g.shadowBlur=4;g.strokeStyle='rgba(220,248,255,'+(.55*Math.min(1,it.raw*1.6)+.1)+')';g.lineWidth=1.1;g.lineJoin='round';g.stroke();g.restore();});
  /* 外框立方体线 */
  if(opt.cube!==false){const cs=[];for(const a of[-.5,.5])for(const b of[-.5,.5])for(const c of[-.5,.5])cs.push([a,b,c]);const P=cs.map(vw.proj);g.save();g.strokeStyle='rgba(160,240,255,.55)';g.lineWidth=1.2;g.setLineDash([5,4]);
    [[0,1],[2,3],[4,5],[6,7],[0,2],[1,3],[4,6],[5,7],[0,4],[1,5],[2,6],[3,7]].forEach(([i,j])=>{g.beginPath();g.moveTo(P[i].x,P[i].y);g.lineTo(P[j].x,P[j].y);g.stroke();});g.restore();}
}
function drawModel(id,cx,cy,R,y,x,T,full){
  if(id==='water')R*=1.5;
  const vw=view(cx,cy,R,y,x),m=full?(previews[id]||(previews[id]=MODELS[id]())):model;
  if(id==='water')drawWater(vw,m,T,{full});else drawBall(vw,m,T,{full});
}
/* 全息底座 */
function drawBase(cx,cy,r,t){
  g.save();g.translate(cx,cy);g.scale(1,.24);
  const rg=g.createRadialGradient(0,0,r*.1,0,0,r);rg.addColorStop(0,'rgba(150,245,255,.5)');rg.addColorStop(.6,'rgba(60,170,255,.22)');rg.addColorStop(1,'rgba(60,170,255,0)');g.fillStyle=rg;g.beginPath();g.arc(0,0,r,0,TAU);g.fill();
  g.strokeStyle='rgba(160,245,255,.8)';g.lineWidth=2.2;g.beginPath();g.arc(0,0,r*.72,0,TAU);g.stroke();
  g.setLineDash([10,8]);g.lineDashOffset=-t/40;g.strokeStyle='rgba(160,245,255,.55)';g.lineWidth=1.6;g.beginPath();g.arc(0,0,r*.95,0,TAU);g.stroke();g.restore();
}
function drawBg(t){
  const bg=g.createRadialGradient(W*.5,H*.45,0,W*.5,H*.5,Math.max(W,H)*.75);bg.addColorStop(0,'rgba(14,52,120,.42)');bg.addColorStop(1,'rgba(3,12,40,.62)');g.fillStyle=bg;g.fillRect(0,0,W,H);
  g.strokeStyle='rgba(100,200,255,.09)';g.lineWidth=1;const st=44,ox=(W/2)%st,oy=(H/2)%st;g.beginPath();for(let x=ox;x<W;x+=st){g.moveTo(x,0);g.lineTo(x,H);}for(let y=oy;y<H;y+=st){g.moveTo(0,y);g.lineTo(W,y);}g.stroke();
  g.strokeStyle='rgba(140,235,255,.9)';g.lineWidth=2;const m=10,l=22;[[m,m,1,1],[W-m,m,-1,1],[m,H-m,1,-1],[W-m,H-m,-1,-1]].forEach(([x,y,sx,sy])=>{g.beginPath();g.moveTo(x,y+sy*l);g.lineTo(x,y);g.lineTo(x+sx*l,y);g.stroke();});
}
function slots(){const R=Math.min(W/6.4,H*.28);return[0,1,2].map(i=>({x:W*(i*2+1)/6,y:H*.46,R}));}
function frame(ms){
  raf=0;if(!running||document.hidden)return;
  const dt=Math.min(.05,(ms-last)/1000||0);last=ms;
  g.setTransform(dpr,0,0,dpr,0,0);g.clearRect(0,0,W,H);drawBg(ms);
  if(phase==='select'){
    const sl=slots();
    LIST.forEach((it,i)=>{const s=sl[i],hv=hover===i,R=s.R*(hv?1.1:1);
      drawBase(s.x,s.y+R*1.18,R*1.05,ms);
      drawModel(it.id,s.x,s.y+(Math.sin(ms/700+i)*4),R,ms/1800+i*1.7,.32,0,true);
      g.save();g.textAlign='center';g.fillStyle=hv?'#fff':'#dff6ff';g.shadowColor='rgba(110,235,255,.95)';g.shadowBlur=hv?16:8;g.font='800 '+Math.round(Math.max(14,Math.min(20,W/38)))+'px "PingFang SC","Microsoft YaHei",sans-serif';g.fillText(it.name,s.x,s.y+R*1.62);
      g.shadowBlur=0;g.fillStyle='rgba(160,230,250,.85)';g.font='600 '+Math.round(Math.max(10,Math.min(12.5,W/60)))+'px "PingFang SC","Microsoft YaHei",sans-serif';g.fillText(it.sub,s.x,s.y+R*1.62+20);
      if(hv){g.strokeStyle='rgba(255,230,140,.95)';g.lineWidth=2;g.setLineDash([6,5]);g.lineDashOffset=-ms/50;g.beginPath();g.arc(s.x,s.y,R*1.2,0,TAU);g.stroke();}g.restore();});
    
  }else if(model){
    if(playing)T+=dt;
    if(!dragging)yaw+=dt*(.35+spinBoost);
    const R=Math.min(W*.26,H*.34);
    drawBase(W/2,H*.5+R*1.12,R*1.25,ms);
    drawModel(model.id,W/2,H*.5,R,yaw,pitch,T,false);
    /* 步骤触发 */
    while(stepIdx<model.steps.length&&T>=model.steps[stepIdx].at){const s=model.steps[stepIdx++];setCaption(s.cap);window.TotoChat&&s.say&&TotoChat.say(s.say);if(s.end){setState('立体密铺完成');syncBtn();}}
    const pr=clamp(T/model.total,0,1);
    g.save();g.fillStyle='rgba(120,230,255,.25)';g.fillRect(24,H-16,W-48,4);g.fillStyle='rgba(160,245,255,.95)';g.shadowColor='#6fe6ff';g.shadowBlur=8;g.fillRect(24,H-16,(W-48)*pr,4);g.restore();
  }

}
function start(){running=true;last=performance.now();if(!raf)raf=requestAnimationFrame(frame);}
function stop(){running=false;}
function resize(){if(!cv)return;const w=cv.clientWidth,h=cv.clientHeight;if(!w)return;dpr=Math.min(2,devicePixelRatio||1);W=w;H=h;cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);}

function build(){
  el=document.createElement('div');el.id='solid';
  el.innerHTML='<div class="lab-frame"><i class="lab-sweep"></i><i class="hud-c a"></i><i class="hud-c b"></i><i class="hud-c c"></i><i class="hud-c d"></i><i class="hud-ticks t"></i><i class="hud-ticks b"></i><i class="hud-ring"></i>'
   +'<div class="lab-head"><div class="lab-title">立体组合密铺<small>3D · SOLID TILING</small></div><div class="lab-state" id="sdState"><i></i>请选择一个立体模型</div><button class="lab-x" id="sdBack">← 返回选择</button></div>'
   +'<div class="lab-main sd-main"><canvas id="sdCv"></canvas></div>'
   +'<div class="sd-bar"><div class="sd-cap" id="sdCap"></div><div class="sd-ctl"><button id="sdPlay"><b>❚❚</b> 暂停</button><button id="sdRe"><b>⟲</b> 重播</button></div></div></div>';
  root.appendChild(el);beam=document.createElement('div');beam.id='solidBeam';beam.innerHTML='<div class="cone"></div><div class="glow"></div>';root.appendChild(beam);
  cv=$('#sdCv');g=cv.getContext('2d');capEl=$('#sdCap');stEl=$('#sdState');btnPlay=$('#sdPlay');btnBack=$('#sdBack');

  btnPlay.addEventListener('click',()=>{if(model&&T>=model.total){replay();return;}playing=!playing;syncBtn();});
  btnBack.addEventListener('click',()=>{if(phase==='proc')showSelect();else close();});

    if(dragging){dragging.moved=Math.max(dragging.moved,Math.hypot(p.x-dragging.x,p.y-dragging.y));if(phase==='proc'){yaw=dragging.yaw0+(p.x-dragging.x)*.01;pitch=clamp(dragging.pit0+(p.y-dragging.y)*.008,-1.2,1.2);}return;}
    if(phase==='select'){const sl=slots();hover=-1;sl.forEach((s,i)=>{if(Math.hypot(p.x-s.x,p.y-s.y)<s.R*1.2)hover=i;});cv.style.cursor=hover>=0?'pointer':'default';}else cv.style.cursor='grab';});

/* 演示模式的预设回答 */
function demo(q){
  const t=q.trim();
  if(/密铺/.test(t)&&/什么/.test(t))return '密铺就是用一种或几种形状，不留缝隙、不重叠地铺满整个平面，像地砖一样。正三角形、正方形、正六边形都可以单独密铺哦！';
  if(/五边形/.test(t))return '正五边形的每个内角是 108°，360 不能被 108 整除，所以围着一个点拼不满一圈，单独用它没法密铺。';
  if(/足球/.test(t))return '足球表面是 12 块正五边形加 20 块正六边形，这样的组合刚好能把球面包得又圆又均匀。';
  return '这是演示模式的回答。点右上角 ⚙ 填入你的百炼 API Key，我就能用真正的 AI 回答你的问题啦！';
}
async function* fake(text){for(const ch of text){await new Promise(r=>setTimeout(r,28));yield ch;}}

async function* direct(q,key){
  const msgs=[{role:'system',content:PERSONA},...hist.slice(-10),{role:'user',content:q}];
  let res;const ac=new AbortController();const to=setTimeout(()=>ac.abort(),30000);
  try{res=await fetch(BAILIAN_URL,{signal:ac.signal,method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+key},body:JSON.stringify({model:BAILIAN_MODEL,messages:msgs,stream:true,temperature:.7,max_tokens:600})});}
  catch(e){clearTimeout(to);throw new Error(e&&e.name==='AbortError'?'等待超时，请检查网络后再试':'无法连接百炼（网络问题，或浏览器跨域限制）。若是跨域，需要改用后端转发。');}
  clearTimeout(to);
  if(!res.ok){let m='';try{m=(await res.json()).error?.message||'';}catch(e){}
    throw new Error(res.status===401?'API Key 无效，请点 ⚙ 重新设置':(m||'请求失败（'+res.status+'）'));}
  const rd=res.body.getReader(),dec=new TextDecoder();let buf='',ans='';
  for(;;){
    const {value,done}=await rd.read();if(done)break;
    buf+=dec.decode(value,{stream:true});
    let i;while((i=buf.indexOf('\n'))>=0){
      const line=buf.slice(0,i).trim();buf=buf.slice(i+1);
      if(!line.startsWith('data:'))continue;const d=line.slice(5).trim();
      if(d==='[DONE]'){hist.push({role:'user',content:q},{role:'assistant',content:ans});return;}
      try{const t=JSON.parse(d).choices?.[0]?.delta?.content;if(t){ans+=t;yield t;}}catch(e){}
    }
  }
  if(ans)hist.push({role:'user',content:q},{role:'assistant',content:ans});
}
async function* stream(q){
  if(!API){const k=getKey();if(k){yield* direct(q,k);return;}
    yield* fake(demo(q)+(keyBar?'':''));return;}
  const res=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({sessionId:sid,message:q})});
  if(!res.ok){let m='';try{m=(await res.json()).error||'';}catch(e){}throw new Error(m||('请求失败（'+res.status+'）'));}
  const ct=res.headers.get('content-type')||'';
  if(!ct.includes('text/event-stream')){const j=await res.json();yield j.reply||'';return;}
  const rd=res.body.getReader(),dec=new TextDecoder();let buf='';
  for(;;){
    const {value,done}=await rd.read();if(done)break;
    buf+=dec.decode(value,{stream:true});
    let i;while((i=buf.indexOf('\n\n'))>=0){
      const ev=buf.slice(0,i);buf=buf.slice(i+2);
      const line=ev.split('\n').find(l=>l.startsWith('data:'));if(!line)continue;
      const d=line.slice(5).trim();if(d==='[DONE]')return;
      try{const o=JSON.parse(d);if(o.error)throw new Error(o.error);if(o.t)yield o.t;}catch(e){if(e.message&&!(e instanceof SyntaxError))throw e;}
    }
  }
}
const hooks=[];
async function ask(q){
  q=(q||'').trim();if(!q)return;
  if(busy){if(Date.now()-busyAt<35000)return;}   /* 防卡死：超过 35 秒强制恢复 */
  busy=true;busyAt=Date.now();send.disabled=true;input.value='';quick.style.display='none';
  add('me',q);
  const done=()=>{busy=false;send.disabled=false;input.focus();};
  try{
    for(const h of hooks){let r=false;try{r=await h(q);}catch(e){}if(r){done();return;}}   /* 引导流程优先接管 */
    const b=add('bot','','typing');let got=false;
    try{for await(const t of stream(q)){got=true;b.textContent+=t;list.scrollTop=list.scrollHeight;}
      if(!got)b.textContent='拓拓刚刚走神了，再问一次好吗？';
    }catch(e){b.classList.add('err');b.textContent='哎呀，连接出了点问题：'+(e.message||'请稍后再试');}
    b.classList.remove('typing');
  }finally{done();}
}
form.addEventListener('submit',e=>{e.preventDefault();ask(input.value);});
send.addEventListener('click',e=>{e.preventDefault();ask(input.value);});
input.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.isComposing){e.preventDefault();ask(input.value);}});

/* 小拓拓：立体质感的银白机器人，会漂浮、转头、眨眼、挥手，回答时嘴巴会动 */
(function(){const cvs=$('tcToto');if(!cvs)return;const c=cvs.getContext('2d');let raf=0,blinkAt=1.5,blink=0;
 const S=cvs.width/68;
 const rg=(x,y,r0,x1,y1,r1,stops)=>{const g=c.createRadialGradient(x,y,r0,x1,y1,r1);stops.forEach(s=>g.addColorStop(s[0],s[1]));return g;};
 const lg=(x0,y0,x1,y1,stops)=>{const g=c.createLinearGradient(x0,y0,x1,y1);stops.forEach(s=>g.addColorStop(s[0],s[1]));return g;};
 function ell(x,y,rx,ry,fill,rot){c.beginPath();c.ellipse(x,y,Math.max(.01,rx),Math.max(.01,ry),rot||0,0,Math.PI*2);c.fillStyle=fill;c.fill();}
 function limb(x0,y0,x1,y1,cx1,cy1){c.lineCap='round';
  c.beginPath();c.moveTo(x0,y0);c.quadraticCurveTo(cx1,cy1,x1,y1);c.strokeStyle='#7d89a8';c.lineWidth=5.4;c.stroke();
  c.strokeStyle=lg(x0,y0-3,x0,y0+4,[[0,'#ffffff'],[1,'#c4cee2']]);c.lineWidth=4;c.stroke();
  c.strokeStyle='rgba(255,255,255,.8)';c.lineWidth=1;c.beginPath();c.moveTo(x0,y0-1);c.quadraticCurveTo(cx1,cy1-1,x1,y1-1);c.stroke();
  ell(x1,y1,3.3,3.3,'#7d89a8');ell(x1,y1,2.7,2.7,rg(x1-.8,y1-.9,.3,x1,y1,3,[[0,'#ffffff'],[1,'#b9c4dc']]));}
 function draw(ms){raf=0;if(!panel.classList.contains('open'))return;
  const t=ms/1000,talk=!!list.querySelector('.tc-msg.typing'),bob=Math.sin(t*2.1)*1.6,yaw=Math.sin(t*.75)*.45+(talk?Math.sin(t*3)*.15:0);
  c.setTransform(S,0,0,S,0,0);c.clearRect(0,0,68,68);
  /* 地面阴影 + 喷射火焰 */
  const sh=1-bob*.04;ell(34,64.5,11*sh,2.4*sh,'rgba(13,52,73,.28)');
  const fl=5+Math.sin(t*30)*1.6+Math.sin(t*17),fg=lg(0,54,0,54+fl*2,[[0,'rgba(255,230,160,.95)'],[.5,'rgba(193,232,254,.6)'],[1,'rgba(141,213,254,0)']]);
  c.fillStyle=fg;c.beginPath();c.moveTo(30.5,54+bob);c.quadraticCurveTo(34,56+fl*2.2+bob,37.5,54+bob);c.closePath();c.fill();
  /* 手臂（后） */
  limb(25,45+bob,17.5,52+bob+Math.sin(t*2.4+1)*1.4,19,47+bob);
  /* 身体 */
  ell(34,45+bob,9.8,10.6,'#7d89a8');
  ell(34,45+bob,9.2,10,rg(30,40+bob,1,34,45+bob,12,[[0,'#ffffff'],[.55,'#dfe6f3'],[1,'#8b98b8']]));
  ell(34,46.5+bob,3,3,rg(33,45.5+bob,.3,34,46.5+bob,3.2,[[0,'#ffe9b0'],[.5,'#c1e8fe'],[1,'#7ed0ff']]));
  /* 颈环 */
  c.lineWidth=2.4;c.strokeStyle=lg(22,0,46,0,[[0,'#67bbea'],[.5,'#c1e8fe'],[1,'#67bbea']]);c.beginPath();c.ellipse(34,35.5+bob,11.5,2.8,0,0,Math.PI*2);c.stroke();
  /* 手臂（前，挥手） */
  const wave=talk?Math.sin(t*10)*5.5:Math.sin(t*3)*2.6;
  limb(43,44+bob,51.5,35+bob+wave,50,43+bob);
  /* 头 */
  const hx=34+yaw*1.4,hy=22+bob;
  ell(hx-16.2*Math.abs(Math.cos(yaw*.5)),hy+.5,2.6*(1-Math.max(0,yaw)*.6),4,'#67bbea');ell(hx+16.2*Math.abs(Math.cos(yaw*.5)),hy+.5,2.6*(1+Math.min(0,yaw)*.6),4,'#67bbea');
  ell(hx,hy,17.4,14.8,'#7d89a8');
  ell(hx,hy,16.8,14.2,rg(hx-6,hy-7,1,hx,hy,19,[[0,'#ffffff'],[.5,'#e3e9f5'],[1,'#8f9cbd']]));
  c.strokeStyle='rgba(191,231,255,.85)';c.lineWidth=1.3;c.beginPath();c.ellipse(hx,hy,16.2,13.6,0,-.7,.6);c.stroke();
  /* 面罩 */
  const vx=34+yaw*3.6,vy=23+bob,vw=12.8*(1-.14*Math.abs(yaw));
  ell(vx,vy,vw+.9,9.6,'#b8c3dc');
  ell(vx,vy,vw,8.8,lg(vx,vy-9,vx,vy+9,[[0,'#2f6b8d'],[1,'#0c0a26']]));
  ell(vx-vw*.35,vy-4.6,vw*.5,1.7,'rgba(255,255,255,.28)',-.15);
  /* 眼睛 */
  if(t>blinkAt){blink=1;if(t>blinkAt+.15){blink=0;blinkAt=t+2+Math.random()*3;}}
  const eh=blink?.35:3;c.shadowColor='#bde7ff';c.shadowBlur=7;
  [-1,1].forEach(s=>{const ex=vx+s*vw*.38,ey=vy-.6;ell(ex,ey,2.2,eh,rg(ex-.5,ey-.8,.2,ex,ey,3,[[0,'#ffffff'],[.6,'#c1e8fe'],[1,'#8fd6fe']]));});
  c.shadowBlur=3;c.strokeStyle='#c1e8fe';c.lineWidth=1.3;c.beginPath();
  if(talk){const m=.7+Math.abs(Math.sin(t*14))*2.2;c.ellipse(vx,vy+5,2.2,m*.6,0,0,Math.PI*2);c.stroke();}
  else{c.arc(vx,vy+2.6,3,.15*Math.PI,.85*Math.PI);c.stroke();}
  c.shadowBlur=0;
  /* 高光 */
  ell(hx-7,hy-10.4,6.2,2.2,'rgba(255,255,255,.7)',-.45);
  /* 天线 */
  const sw=Math.sin(t*3)*1.8;c.strokeStyle='#7d89a8';c.lineWidth=2;c.lineCap='round';
  c.beginPath();c.moveTo(hx,hy-14);c.quadraticCurveTo(hx+sw*.3,hy-18,hx+sw,hy-21);c.stroke();
  ell(hx+sw,hy-22.2,2.7,2.7,'#7d89a8');ell(hx+sw,hy-22.2,2.2,2.2,rg(hx+sw-.6,hy-22.8,.2,hx+sw,hy-22.2,2.4,talk?[[0,'#fff6c8'],[1,'#ffb52e']]:[[0,'#c1e8fe'],[.5,'#bce7ff'],[1,'#6ac4f7']]));
  raf=requestAnimationFrame(draw);}
 const kick=()=>{if(!raf)raf=requestAnimationFrame(draw);};
 new MutationObserver(kick).observe(panel,{attributes:true,attributeFilter:['class']});kick();})();

/* 可拖动：按住标题栏移动对话框 */
(function(){const hd=panel.querySelector('.tc-head');let dx=0,dy=0,on=false;
 hd.style.cursor='move';
 hd.addEventListener('pointerdown',e=>{if(e.target.closest('button'))return;const r=panel.getBoundingClientRect();dx=e.clientX-r.left;dy=e.clientY-r.top;on=true;hd.setPointerCapture(e.pointerId);});
 hd.addEventListener('pointermove',e=>{if(!on)return;const w=panel.offsetWidth,h=panel.offsetHeight;
  const x=Math.max(0,Math.min(innerWidth-w,e.clientX-dx)),y=Math.max(0,Math.min(innerHeight-h,e.clientY-dy));
  panel.style.left=x+'px';panel.style.top=y+'px';panel.style.right='auto';panel.style.bottom='auto';});
 const end=()=>{on=false;};hd.addEventListener('pointerup',end);hd.addEventListener('pointercancel',end);})();

/* ---- 供页面其它模块（画布引导等）调用的对话接口 ---- */
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
async function botSay(text,opts){
  open();const b=add('bot','','typing');
  for(let i=0;i<text.length;i++){b.textContent+=text[i];if(i%3===0){list.scrollTop=list.scrollHeight;await sleep(16);}}
  b.classList.remove('typing');
  if(opts&&opts.buttons){const row=document.createElement('div');row.className='tc-btns';
    opts.buttons.forEach(bt=>{const x=document.createElement('button');x.type='button';x.textContent=bt.label;
      x.onclick=()=>{row.querySelectorAll('button').forEach(y=>{y.disabled=true;});x.classList.add('picked');bt.onClick&&bt.onClick();};row.appendChild(x);});
    list.appendChild(row);}
  list.scrollTop=list.scrollHeight;return b;
}
function setQuick(arr){quick.innerHTML='';(arr||[]).forEach(q=>{const b=document.createElement('button');b.type='button';b.textContent=q;b.onclick=()=>ask(q);quick.appendChild(b);});quick.style.display=(arr&&arr.length)?'flex':'none';}
window.TotoChat={open,say:botSay,user:t=>add('me',t),setQuick,hook:fn=>{hooks.push(fn);return()=>{const i=hooks.indexOf(fn);if(i>=0)hooks.splice(i,1);};},reset:()=>{list.innerHTML='';greeted=false;}};
})();
