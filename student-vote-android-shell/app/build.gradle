plugins { id 'com.android.application' }

android {
    namespace 'cn.edu.studentvote.shell'
    compileSdk 35

    defaultConfig {
        applicationId 'cn.edu.studentvote.shell'
        minSdk 23
        targetSdk 32
        versionCode 1
        versionName '1.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
}
